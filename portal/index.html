function boiFullReportHTML(sc, w, bank){
  const bd = w.boiFormat.data;
  const introHtml = w.titleTracingIntro ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${esc(w.titleTracingIntro).replace(/\n/g,'<br>')}</p>` : '';
  const tracingHtml = (w.documentsList||[]).length ? w.documentsList.map(d=>d.tracingText ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${renderTracingDisplayText(d.tracingText, d.slNo||'')}</p>` : '').join('') : '';
  const propsText = (w.propertySchedules||[]).length ? w.propertySchedules.map(s=>`<p style="font-size:13px;line-height:1.8;margin:0 0 10px;">${esc(propertyScheduleText(s))}</p>`).join('') : `<p class="empty">Not filled in yet.</p>`;
  const requiredDocs = (w.documentsList||[]).filter(d=>d.isRequiredDocument);

  const kv = (n, label, value) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr><td style="font-weight:700;width:34px;vertical-align:top;border:1px solid #ccc;">${n}</td><td style="width:42%;vertical-align:top;border:1px solid #ccc;">${label}</td><td style="border:1px solid #ccc;">${value||'<span class="hint">Not filled in yet.</span>'}</td></tr>
  </tbody></table>`;
  const heading = (label) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr><td style="border:1px solid #ccc;font-weight:700;">${label}</td></tr>
  </tbody></table>`;

  const simpleRows = BOI_SIMPLE_ITEMS.map(it=>{
    const rowData = bd.simple[it.key]||{value:'',details:''};
    const val = rowData.value + (rowData.details ? ' — '+rowData.details : '');
    return kv(it.n, it.label, esc(val));
  }).join('');

  const flatRows = bd.flatApplicable==='Yes' ? BOI_FLAT_SUBITEMS.map(it=>kv(`19(${it.key})`, it.label, esc(bd.flat[it.key]||''))).join('')
    : kv(19, 'If the property is a flat/apartment or residential/Residential complex, Advocate to interalia check/verify', 'Not applicable');

  return `
  <div class="pv-content" style="padding:6px 4px 20px;">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:16px;">
      <span><b>OpinionCode:</b> ${esc(sc.code)}</span>
    </div>
    <p style="font-size:13px;line-height:1.7;margin:0 0 4px;">To</p>
    <p style="font-size:13px;line-height:1.7;margin:0 0 4px;font-weight:600;">${esc(bd.attentionToName||'')}</p>
    <p style="font-size:13px;line-height:1.7;margin:0 0 16px;">${esc(bank?(bank.bankName+' — '+bank.branchName):(bd.attentionToAddress||''))}</p>
    <p style="font-size:13px;line-height:1.7;margin:0 0 12px;">Dear Sir,</p>
    <p style="font-size:13px;line-height:1.7;margin:0 0 12px;"><b>Ref:</b> Title Opinion on ${esc(bd.refPropertyShort||'the schedule property')}</p>
    <p style="font-size:13px;line-height:1.7;margin:0 0 16px;">With reference to your letter dated ${esc(bd.letterDate?fmtDate(bd.letterDate):'___')}, I, on the basis of the original title deeds forwarded to me pertaining to the said immovable property and the other information submitted by you, have conducted a detailed search and investigation and submit my report as under:</p>

    ${heading('1. NAME AND ADDRESS OF THE MORTGAGOR/TITLE HOLDER:')}
    <div style="padding:10px 0 14px;border:1px solid #ccc;border-top:none;">${boiVendorPurchaserBlock(w)}</div>

    ${heading('2. TITLE DEEDS IN ORIGINAL SEEN BY ME:')}
    <div style="padding:10px 0 14px;">${boiDocsTable(w.documentsList||[])}</div>

    ${heading('3. DESCRIPTION OF IMMOVABLE PROPERTY')}
    <div style="padding:10px 0 14px;">${propsText}</div>

    ${heading('4. SEARCH IN SUB-REGISTRAR\u2019S OFFICE')}
    ${kv('4(i)', 'Location of property / Search and Investigation', `${introHtml}${tracingHtml || '<span class="hint">Not filled in yet.</span>'}<p style="font-size:13px;line-height:1.7;margin:12px 0 0;">Thus, the title holder is having clear, valid, legal and marketable title over the schedule property.</p>`)}
    ${kv('4(ii)', 'Whether the original title deeds are submitted for verification', esc(bd.originalsSubmitted==='Yes'?'The original title deeds are submitted for my verification.':'The original title deeds are not submitted for my verification.') + (bd.originalsSubmittedNote?' '+esc(bd.originalsSubmittedNote):''))}
    ${kv('4(iii)', 'Whether the property is now under the hands of the proposed vendor / ancestral / joint ownership', esc(bd.ancestralJointDetails || (bd.ancestralJointOwnership==='Yes' ? 'The property is an ancestral property / under joint ownership.' : 'The property now under the hands of the proposed vendor and it is not an ancestral property and not under joint ownership.')))}
    ${kv('4(iv)', 'Whether any minor interest is involved in the property offered as a security', esc(bd.minorInterestInvolved==='Yes' ? 'Yes, minor interest is involved.' : 'There is no minor interest involved in the property offered as a security.'))}
    ${kv('4(v)', 'Whether there are any documents pending for registration', esc(bd.documentsPendingRegistration==='Yes' ? 'Yes, some documents are pending for registration.' : 'There are no documents pending for registration.'))}

    ${simpleRows}
    ${flatRows}
    ${kv(20, "Advocate also checking whether the name of mortgagor is reflected as owner in the revenue/Municipal Village records. Whether the property offered as security is clearly demarcated in the title documents, whether the property has clear access as per documents?", esc(bd.mortgagorNameReflected||''))}
    ${kv(21, 'Any bar/restriction for creation of mortgage under any local or special enactments, details of proper registration of documents, payment of proper stamp duty etc.', esc(bd.mortgageBarRestriction||''))}
    ${kv(22, 'Whether the governing law, the constitutional documents of the mortgagor (other than natural persons) permit creation of mortgage and additional precautions, if any to be taken in such cases.', esc(bd.governingLawPermits||''))}

    ${heading('23. CERTIFICATE:')}
    <div style="padding:10px 0 14px;"><p style="font-size:13px;line-height:1.7;margin:0;">${esc(boiCertificateText(w))}</p></div>
    <div style="padding:0 0 14px;">${boiDocsTable(requiredDocs)}</div>

    <p style="font-size:13px;margin:20px 0 4px;"><b>Place:</b> ${esc(w.opinion.place||'')}</p>
    <p style="font-size:13px;margin:0 0 20px;"><b>Date:</b> ${w.opinion.date?fmtDate(w.opinion.date):''}</p>

    <div class="pv-footer" style="margin-top:26px;">
      <span>ADVOCATE</span>
      <span>${esc(FIRM.name)}</span>
    </div>
  </div>`;
}

function renderBoiTemplateView(sc, w){
  if(!w.boiFormat) w.boiFormat = {data:freshBoiFormatData()};
  if(!w.boiFormat.data) w.boiFormat.data = freshBoiFormatData();
  const bd = w.boiFormat.data;
  const bank = state.banks.find(b=>b.id===bd.bankId);
  const sel = (opts, val) => opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('');
  const fld = (html) => `<div class="field" style="margin-bottom:8px;">${html}</div>`;
  const introHtml = w.titleTracingIntro ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${esc(w.titleTracingIntro).replace(/\n/g,'<br>')}</p>` : '';
  const tracingHtml = (w.documentsList||[]).length ? w.documentsList.map(d=>d.tracingText ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${renderTracingDisplayText(d.tracingText, d.slNo||'')}</p>` : '').join('') : '';
  const propsText = (w.propertySchedules||[]).length ? w.propertySchedules.map(s=>`<p style="font-size:13px;line-height:1.8;margin:0 0 10px;">${esc(propertyScheduleText(s))}</p>`).join('') : `<p class="empty">Not filled in yet.</p>`;
  const requiredDocs = (w.documentsList||[]).filter(d=>d.isRequiredDocument);

  const qrow = (n, label, controlsHtml) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr><td style="font-weight:700;width:60px;vertical-align:top;border:1px solid #ccc;">${n}</td><td style="width:38%;vertical-align:top;border:1px solid #ccc;">${label}</td><td style="vertical-align:top;border:1px solid #ccc;">${controlsHtml}</td></tr>
  </tbody></table>`;
  const heading = (label) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr><td style="border:1px solid #ccc;font-weight:700;">${label}</td></tr>
  </tbody></table>`;
  const simpleDropdown = (key) => {
    const row = bd.simple[key]||{value:'',details:''};
    return fld(`<select class="bob-cascade-select" data-lopath="boiFormat.data.simple.${key}.value"><option value="">— select —</option>${sel(BOI_STD_OPTIONS, row.value)}</select>`) +
           fld(`<input data-lopath="boiFormat.data.simple.${key}.details" value="${esc(row.details)}" placeholder="Optional details">`);
  };

  const simpleRowsHtml = BOI_SIMPLE_ITEMS.map(it=>qrow(it.n, it.label, simpleDropdown(it.key))).join('');
  const flatRowsHtml = bd.flatApplicable==='Yes' ? BOI_FLAT_SUBITEMS.map(it=>qrow(`19(${it.key})`, it.label, fld(`<input data-lopath="boiFormat.data.flat.${it.key}" value="${esc(bd.flat[it.key])}">`))).join('') : '';

  return `
  <div class="btnrow" style="margin-bottom:14px;"><button class="btn outline sm" data-action="lo-back-to-templates">&larr; Back to Templates</button></div>

  <div class="field" style="max-width:420px;margin-bottom:16px;">
    <label>Bank &amp; Branch (optional)</label>
    <select id="boiBankSelect">
      <option value="">— select bank / branch —</option>
      ${state.banks.map(b=>`<option value="${b.id}" ${bd.bankId===b.id?'selected':''}>${esc(b.bankName)} — ${esc(b.branchName)}</option>`).join('')}
    </select>
  </div>

  <div class="pv-sheet" style="max-width:100%;">
    <div class="pv-content" style="padding:6px 4px 20px;">
      <p style="font-size:13px;line-height:1.7;margin:0 0 12px;">To</p>
      <div class="row2">
        <div class="field"><label>Addressed To (Name/Designation)</label><input data-lopath="boiFormat.data.attentionToName" value="${esc(bd.attentionToName)}" placeholder="e.g. Ananth Kumar R.D. BNI, Coimbatore"></div>
        <div class="field"><label>Addressed To (Address, if no Bank/Branch selected)</label><input data-lopath="boiFormat.data.attentionToAddress" value="${esc(bd.attentionToAddress)}"></div>
      </div>
      <p style="font-size:13px;line-height:1.7;margin:0 0 12px;">Dear Sir,</p>
      <div class="row2">
        <div class="field"><label>Ref: Title Opinion on</label><input data-lopath="boiFormat.data.refPropertyShort" value="${esc(bd.refPropertyShort)}" placeholder="Short property reference"></div>
        <div class="field"><label>Their Letter Dated</label><input type="date" data-lopath="boiFormat.data.letterDate" value="${esc(bd.letterDate)}"></div>
      </div>

      ${heading('1. NAME AND ADDRESS OF THE MORTGAGOR/TITLE HOLDER:')}
      <div style="padding:10px 0 14px;border:1px solid #ccc;border-top:none;">
        ${boiVendorPurchaserBlock(w)}
        <p class="hint">Tag Title Holders as "Proposed Vendor" / "Proposed Purchaser" in the Title Holders tab.</p>
      </div>

      ${heading('2. TITLE DEEDS IN ORIGINAL SEEN BY ME:')}
      <div style="padding:10px 0 14px;">${boiDocsTable(w.documentsList||[])}</div>

      ${heading('3. DESCRIPTION OF IMMOVABLE PROPERTY')}
      <div style="padding:10px 0 14px;">${propsText}</div>

      ${heading('4. SEARCH IN SUB-REGISTRAR\u2019S OFFICE')}
      ${qrow('4(i)', 'Location of property / Search and Investigation', `${introHtml}${tracingHtml || `<p class="empty">Not filled in yet.</p>`}<p style="font-size:13px;line-height:1.7;margin:12px 0 0;">Thus, the title holder is having clear, valid, legal and marketable title over the schedule property.</p>`)}
      ${qrow('4(ii)', 'Whether the original title deeds are submitted for verification', fld(`<select class="bob-cascade-select" data-lopath="boiFormat.data.originalsSubmitted"><option value="">— select —</option>${sel(BOI_STD_OPTIONS, bd.originalsSubmitted)}</select>`))}
      ${qrow('4(iii)', 'Whether the property is now under the hands of the proposed vendor / ancestral / joint ownership', fld(`<select class="bob-cascade-select" data-lopath="boiFormat.data.ancestralJointOwnership"><option value="">— select —</option>${sel(BOI_STD_OPTIONS, bd.ancestralJointOwnership)}</select>`) + fld(`<input data-lopath="boiFormat.data.ancestralJointDetails" value="${esc(bd.ancestralJointDetails)}" placeholder="Override auto-text if needed">`))}
      ${qrow('4(iv)', 'Whether any minor interest is involved in the property offered as a security', fld(`<select data-lopath="boiFormat.data.minorInterestInvolved"><option value="">— select —</option>${sel(BOI_STD_OPTIONS, bd.minorInterestInvolved)}</select>`))}
      ${qrow('4(v)', 'Whether there are any documents pending for registration', fld(`<select data-lopath="boiFormat.data.documentsPendingRegistration"><option value="">— select —</option>${sel(BOI_STD_OPTIONS, bd.documentsPendingRegistration)}</select>`))}

      ${simpleRowsHtml}

      ${qrow(19, 'If the property is a flat/apartment or residential/Residential complex, Advocate to interalia check/verify', fld(`<select class="bob-cascade-select" data-lopath="boiFormat.data.flatApplicable"><option value="No" ${bd.flatApplicable==='No'?'selected':''}>Not Applicable</option><option value="Yes" ${bd.flatApplicable==='Yes'?'selected':''}>Applicable</option></select>`))}
      ${flatRowsHtml}

      ${qrow(20, "Advocate also checking whether the name of mortgagor is reflected as owner in the revenue/Municipal Village records. Whether the property offered as security is clearly demarcated in the title documents, whether the property has clear access as per documents?", fld(`<textarea data-lopath="boiFormat.data.mortgagorNameReflected" rows="2" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#FCFBF8;font-family:inherit;font-size:13px;">${esc(bd.mortgagorNameReflected)}</textarea>`))}
      ${qrow(21, 'Any bar/restriction for creation of mortgage under any local or special enactments, details of proper registration of documents, payment of proper stamp duty etc.', fld(`<input data-lopath="boiFormat.data.mortgageBarRestriction" value="${esc(bd.mortgageBarRestriction)}">`))}
      ${qrow(22, 'Whether the governing law, the constitutional documents of the mortgagor (other than natural persons) permit creation of mortgage and additional precautions, if any to be taken in such cases.', fld(`<input data-lopath="boiFormat.data.governingLawPermits" value="${esc(bd.governingLawPermits)}">`))}

      ${heading('23. CERTIFICATE:')}
      <div style="padding:10px 0 14px;"><p style="font-size:13px;line-height:1.7;margin:0;">${esc(boiCertificateText(w))}</p></div>
      <div style="padding:0 0 14px;">${boiDocsTable(requiredDocs)}
        <p class="hint">Rows come from Documents List entries with "Is Required Document" checked.</p>
      </div>

      <div class="row2" style="margin-top:10px;">
        <div class="field"><label>Place</label><input data-lopath="opinion.place" value="${esc(w.opinion.place)}"></div>
        <div class="field"><label>Date</label><input type="date" data-lopath="opinion.date" value="${esc(w.opinion.date)}"></div>
      </div>

      <div class="pv-footer" style="margin-top:26px;">
        <span>ADVOCATE</span>
        <span>${esc(FIRM.name)}</span>
      </div>
    </div>
  </div>

  <div class="btnrow" style="margin:20px 0;">
    <button class="btn brass" data-action="save-legal-opinion">Save Legal Opinion</button>
    ${loSavedOnce ? `
    <button class="btn outline sm" data-action="nav" data-view="boi-report-print" data-code="${esc(sc.code)}">Print / Save as PDF</button>
    <button class="btn outline sm" data-action="download-boi-word" data-code="${esc(sc.code)}">Download as Word</button>` : ''}
  </div>
  ${!loSavedOnce ? `<p class="hint">Save once to unlock Word / PDF download.</p>` : ''}`;
}

function renderBoiReportPrint(){
  const code = state.params.code;
  const sc = state.serviceCodes.find(c=>c.code===code);
  const lo = state.legalOpinions.find(l=>l.serviceCode===code);
  if(!sc || !lo){ return `<div class="empty-hero">Save the Bank of India report at least once first.</div>`; }
  const bank = state.banks.find(b=>b.id===(lo.boiFormat&&lo.boiFormat.data&&lo.boiFormat.data.bankId));
  return `
  <div class="no-print" style="padding:14px 20px;">
    <button class="btn outline sm" data-action="nav" data-view="legal-opinion" data-code="${esc(code)}">&larr; Back</button>
    <button class="btn brass sm" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div class="pv-sheet">
    ${boiFullReportHTML(sc, lo, bank)}
  </div>`;
}

function downloadBoiAsWord(code){
  const sc = state.serviceCodes.find(c=>c.code===code);
  const lo = state.legalOpinions.find(l=>l.serviceCode===code);
  if(!sc || !lo){ alert('Save the Bank of India report at least once first.'); return; }
  const bank = state.banks.find(b=>b.id===(lo.boiFormat&&lo.boiFormat.data&&lo.boiFormat.data.bankId));
  const bodyHtml = boiFullReportHTML(sc, lo, bank);
  const doc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>Bank of India Opinion ${esc(sc.code)}</title>
  <style>
    body{font-family:Calibri,Arial,sans-serif;font-size:13px;color:#1A1A1A;}
    table{border-collapse:collapse;width:100%;margin-bottom:10px;}
    td,th{border:1px solid #ccc;padding:6px 8px;font-size:12px;}
    th{background:#16233A;color:#fff;}
    h1{font-size:18px;text-align:center;} h3{font-size:13px;margin-top:14px;}
  </style></head>
  <body>
    ${bodyHtml}
  </body></html>`;
  const blob = new Blob(['\ufeff', doc], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Bank_of_India_Opinion_${sc.code}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function cbiFullReportHTML(sc, w, bank){
  const bd = w.cbiFormat.data;
  const introHtml = w.titleTracingIntro ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${esc(w.titleTracingIntro).replace(/\n/g,'<br>')}</p>` : '';
  const tracingHtml = (w.documentsList||[]).length ? w.documentsList.map(d=>d.tracingText ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${renderTracingDisplayText(d.tracingText, d.slNo||'')}</p>` : '').join('') : '';
  const propsText = (w.propertySchedules||[]).length ? w.propertySchedules.map(s=>`<p style="font-size:13px;line-height:1.8;margin:0 0 10px;">${esc(propertyScheduleText(s))}</p>`).join('') : `<p class="empty">Not filled in yet.</p>`;
  const requiredDocs = (w.documentsList||[]).filter(d=>d.isRequiredDocument);
  const cert = cbiCertificateText(w);

  const kv = (n, label, value) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr><td style="font-weight:700;width:70px;vertical-align:top;border:1px solid #ccc;">${n}</td><td style="width:42%;vertical-align:top;border:1px solid #ccc;">${label}</td><td style="border:1px solid #ccc;">${value||'<span class="hint">Not filled in yet.</span>'}</td></tr>
  </tbody></table>`;
  const heading = (label) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr><td style="border:1px solid #ccc;font-weight:700;">${label}</td></tr>
  </tbody></table>`;

  const simpleRows = CBI_SIMPLE_ITEMS.map(it=>{
    const row = bd.simple[it.key]||{value:'',details:''};
    const val = row.value + (row.details ? ' — '+row.details : '');
    return kv(it.n, it.label, esc(val));
  }).join('');
  const agriRows = CBI_AGRI_SUBITEMS.map(it=>kv(`37(${it.key})`, it.label, esc(bd.agri[it.key]||''))).join('');
  const poaRows = bd.poaInvolved==='Yes' ? CBI_POA_SUBITEMS.map(it=>kv(`14.3(${it.key})`, it.label, esc(bd.poa[it.key]||''))).join('') : kv('14.3(a)', 'Whether any Power of Attorney (POA) is involved in the chain of title?', 'No');

  return `
  <div class="pv-content" style="padding:6px 4px 20px;">
    <p style="font-size:13px;text-align:right;margin:0 0 8px;"><b>Date:</b> ${w.opinion.date?fmtDate(w.opinion.date):''}</p>
    <h1 style="font-family:'Lora',serif;font-size:18px;text-align:center;margin-bottom:16px;">LEGAL SCRUTINY REPORT</h1>
    <p style="font-size:13px;line-height:1.7;margin:0 0 4px;">To,</p>
    <p style="font-size:13px;line-height:1.7;margin:0 0 4px;font-weight:600;">${esc(bank?(bank.bankName+' — '+bank.branchName):'')}</p>
    <p style="font-size:13px;line-height:1.7;margin:0 0 16px;">${esc(bank?bank.branchAddress||'':'')}</p>
    <p style="font-size:13px;line-height:1.7;margin:0 0 12px;">Dear Sir,</p>
    <p style="font-size:13px;line-height:1.7;margin:0 0 16px;">With reference to your instructions bearing letter no. ${esc(bd.letterNo||'___')} dated ${bd.letterDate?fmtDate(bd.letterDate):'___'}, I submit my Legal Scrutiny Report as hereunder:</p>

    ${kv(1, 'Name and address of the present title holder:', esc(cbiPresentTitleHolderNames(w)))}

function renderCbiReportPrint(){
  const code = state.params.code;
  const sc = state.serviceCodes.find(c=>c.code===code);
  const lo = state.legalOpinions.find(l=>l.serviceCode===code);
  if(!sc || !lo){ return `<div class="empty-hero">Save the Central Bank of India report at least once first.</div>`; }
  const bank = state.banks.find(b=>b.id===(lo.cbiFormat&&lo.cbiFormat.data&&lo.cbiFormat.data.bankId));
  return `
  <div class="no-print" style="padding:14px 20px;">
    <button class="btn outline sm" data-action="nav" data-view="legal-opinion" data-code="${esc(code)}">&larr; Back</button>
    <button class="btn brass sm" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div class="pv-sheet">
    ${cbiFullReportHTML(sc, lo, bank)}
  </div>`;
}

function downloadCbiAsWord(code){
  const sc = state.serviceCodes.find(c=>c.code===code);
  const lo = state.legalOpinions.find(l=>l.serviceCode===code);
  if(!sc || !lo){ alert('Save the Central Bank of India report at least once first.'); return; }
  const bank = state.banks.find(b=>b.id===(lo.cbiFormat&&lo.cbiFormat.data&&lo.cbiFormat.data.bankId));
  const bodyHtml = cbiFullReportHTML(sc, lo, bank);
  const doc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>Central Bank of India Opinion ${esc(sc.code)}</title>
  <style>
    body{font-family:Calibri,Arial,sans-serif;font-size:13px;color:#1A1A1A;}
    table{border-collapse:collapse;width:100%;margin-bottom:10px;}
    td,th{border:1px solid #ccc;padding:6px 8px;font-size:12px;}
    th{background:#16233A;color:#fff;}
    h1{font-size:18px;text-align:center;} h3{font-size:13px;margin-top:14px;}
  </style></head>
  <body>
    ${bodyHtml}
  </body></html>`;
  const blob = new Blob(['\ufeff', doc], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Central_Bank_of_India_Opinion_${sc.code}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderCbiAnnexureEPrint(){
  const code = state.params.code;
  const sc = state.serviceCodes.find(c=>c.code===code);
  const lo = state.legalOpinions.find(l=>l.serviceCode===code);
  if(!sc || !lo){ return `<div class="empty-hero">Save the Central Bank of India (Annexure E) report at least once first.</div>`; }
  const bank = state.banks.find(b=>b.id===(lo.cbiFormat&&lo.cbiFormat.data&&lo.cbiFormat.data.bankId));
  return `
  <div class="no-print" style="padding:14px 20px;">
    <button class="btn outline sm" data-action="nav" data-view="legal-opinion" data-code="${esc(code)}">&larr; Back</button>
    <button class="btn brass sm" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div class="pv-sheet">
    ${cbiAnnexureEReportHTML(sc, lo, bank)}
  </div>`;
}

function downloadCbiAnnexureEAsWord(code){
  const sc = state.serviceCodes.find(c=>c.code===code);
  const lo = state.legalOpinions.find(l=>l.serviceCode===code);
  if(!sc || !lo){ alert('Save the Central Bank of India (Annexure E) report at least once first.'); return; }
  const bank = state.banks.find(b=>b.id===(lo.cbiFormat&&lo.cbiFormat.data&&lo.cbiFormat.data.bankId));
  const bodyHtml = cbiAnnexureEReportHTML(sc, lo, bank);
  const doc = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>Central Bank of India Annexure E ${esc(sc.code)}</title>
  <style>
    body{font-family:Calibri,Arial,sans-serif;font-size:13px;color:#1A1A1A;}
    table{border-collapse:collapse;width:100%;margin-bottom:10px;}
    td,th{border:1px solid #ccc;padding:6px 8px;font-size:12px;}
    th{background:#16233A;color:#fff;}
    h1{font-size:16px;text-align:center;} h3{font-size:13px;margin-top:14px;}
  </style></head>
  <body>
    ${bodyHtml}
  </body></html>`;
  const blob = new Blob(['\ufeff', doc], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Central_Bank_of_India_AnnexureE_${sc.code}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    <h3 style="font-size:13.5px;margin:20px 0 8px;">CERTIFICATE</h3>

    ${kvbDocsTable(requiredDocs)}
    <p style="font-size:13px;line-height:1.7;margin:10px 0;">7. There are no legal impediments under any applicable Law/Rules in force.</p>

function renderKvbTemplateView(sc, w){
  if(!w.kvbFormat) w.kvbFormat = {data:freshKvbFormatData()};
  if(!w.kvbFormat.data) w.kvbFormat.data = freshKvbFormatData();
  const bd = w.kvbFormat.data;
  const sel = (opts, val) => opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('');
  const yn = (val) => sel(['Yes','No','Not applicable','Not Applicable'], val);
  const introHtml = w.titleTracingIntro ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${esc(w.titleTracingIntro).replace(/\n/g,'<br>')}</p>` : '';
  const tracingHtml = (w.documentsList||[]).length ? w.documentsList.map(d=>d.tracingText ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${renderTracingDisplayText(d.tracingText, d.slNo||'')}</p>` : '').join('') : '';
  const propsText = (w.propertySchedules||[]).length ? w.propertySchedules.map(s=>`<p style="font-size:13px;line-height:1.8;margin:0 0 10px;">${esc(propertyScheduleText(s))}</p>`).join('') : `<p class="empty">Not filled in yet.</p>`;
  const requiredDocs = (w.documentsList||[]).filter(d=>d.isRequiredDocument);
  const copyDocs = (w.documentsList||[]).filter(d=>!d.isRequiredDocument && d.natureOfDocument && d.natureOfDocument!=='Original');
  const primaryDoc = bobPrimaryDocument(w);

  const qrow = (n, label, controlsHtml) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr><td style="font-weight:700;width:70px;vertical-align:top;border:1px solid #ccc;">${n}</td><td style="width:38%;vertical-align:top;border:1px solid #ccc;">${label}</td><td style="vertical-align:top;border:1px solid #ccc;">${controlsHtml}</td></tr>
  </tbody></table>`;
  const heading = (label) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr><td style="border:1px solid #ccc;font-weight:700;">${label}</td></tr>
  </tbody></table>`;
  const txt = (path, val, ph) => `<input data-lopath="kvbFormat.data.${path}" value="${esc(val)}" ${ph?`placeholder="${esc(ph)}"`:''}>`;
  const ynSelect = (path, val) => `<select data-lopath="kvbFormat.data.${path}"><option value="">— select —</option>${yn(val)}</select>`;
  const subRows = (arr, dataKey, prefix) => arr.map(it=>qrow(`${prefix}(${it.key})`, it.label, txt(`${dataKey}.${it.key}`, bd[dataKey][it.key]))).join('');

  const subBlock = kvbSelectedSubBlock(bd);
  const subBlockKeyMap = {'Government Grant / Allotment / Lease-cum-Sale':'govtGrant','Gift / Settlement Deed':'giftSettlement','Partition Deed / Family Settlement':'partition','Will / Testamentary Document':'will','WAKF-related':'wakf'};
  const constBlockKeyMap = {'HUF':'huf','Partnership Firm':'partnership','LLP':'llp','Limited Company':'company','Trust':'trust','Society':'trust'};
  const constBlock = kvbSelectedConstitutionBlock(bd);

  return `
  <div class="btnrow" style="margin-bottom:14px;"><button class="btn outline sm" data-action="lo-back-to-templates">&larr; Back to Templates</button></div>
  <div class="field" style="max-width:420px;margin-bottom:16px;">
    <label>Bank &amp; Branch</label>
    <select id="kvbBankSelect">
      <option value="">— select bank / branch —</option>
      ${state.banks.map(b=>`<option value="${b.id}" ${bd.bankId===b.id?'selected':''}>${esc(b.bankName)} — ${esc(b.branchName)}</option>`).join('')}
    </select>
  </div>

  <div class="pv-sheet" style="max-width:100%;">
    <div class="pv-content" style="padding:6px 4px 20px;">
      <h1 style="font-family:'Lora',serif;font-size:17px;text-align:center;margin-bottom:16px;">OPINION ON TITLE TO THE PROPERTY</h1>

      <h3 style="font-size:13.5px;margin:14px 0 8px;">I. TITLE HOLDER PARTICULARS</h3>
      ${qrow(1, 'Name & Address of the Title Holder', `<p style="font-size:13px;margin:0;">${esc(privateTitleHolderLines(w))}</p><p class="hint" style="margin-top:6px;">Edit in the Title Holders tab.</p>`)}
      ${qrow(2, 'Name & address of the Borrower/Co-Applicant', `<p style="font-size:13px;margin:0;">${esc(kvbBorrowerNames(w))}</p><p class="hint" style="margin-top:6px;">Tag Title Holders as "Borrower"/"Co-Borrower".</p>`)}
      ${qrow(3, 'Constitution', `<select class="bob-cascade-select" data-lopath="kvbFormat.data.constitution"><option value="">— select —</option>${sel(KVB_CONSTITUTION_OPTIONS, bd.constitution)}</select>`)}

      <h3 style="font-size:13.5px;margin:16px 0 8px;">II. PROPERTY PARTICULARS</h3>
      ${qrow('(a)', 'Nature of the property', `<select data-lopath="kvbFormat.data.propertyNature"><option value="">— select —</option>${sel(KVB_PROPERTY_NATURE_OPTIONS, bd.propertyNature)}</select>`)}
      ${qrow('(b)', 'Survey/Gat/Khasra/Khata/Khewat/Patta No.', txt('surveyNo', bd.surveyNo))}
      ${qrow('(c)', 'Plot/Door/Shop/Bungalow No.', txt('plotDoorNo', bd.plotDoorNo))}
      ${qrow('(d)', 'Land Extent', txt('landExtent', bd.landExtent))}
      ${qrow('(e)', 'UDS land extent', txt('udsExtent', bd.udsExtent))}
      ${qrow('(f)', 'Carpet area/Built up area', txt('carpetArea', bd.carpetArea))}
      ${qrow('(g)', 'Floor No.', txt('floorNo', bd.floorNo))}
      ${qrow('(h)', 'Stage/Sector/Ward/Block No.', txt('stageSector', bd.stageSector))}
      ${qrow('(i)', 'Building/Society Name', txt('buildingName', bd.buildingName))}
      ${qrow('(j)', 'Street Name/No.', txt('streetName', bd.streetName))}
      ${qrow('(k)-(o)', 'Village/Taluk/District/State — from Description of Property tab; PIN Code here', txt('pinCode', bd.pinCode, 'PIN Code'))}

      <h3 style="font-size:13px;margin:14px 0 8px;">Description of the property offered as security</h3>
      <div style="padding:0 0 14px;">${propsText}<p class="hint">Edit in the Description of Property tab.</p></div>

      ${qrow('(q)', 'Whether the subject property is enforceable Under SARFAESI Act?', ynSelect('sarfaesiApplicable', bd.sarfaesiApplicable))}
      ${qrow('(r)', 'Whether the property has clear access as per the documents perused?', ynSelect('accessClear', bd.accessClear))}
      ${qrow('(sr)', 'Whether permission for conversion of lands from agriculture to residence/commercial/industrial use is obtained?', ynSelect('conversionPermission', bd.conversionPermission))}
      ${qrow('(s)', 'Whether the property offered is clearly demarcated and legally valid?', ynSelect('demarcationValid', bd.demarcationValid))}
      ${qrow('(t)', 'Whether the property is situated in DTCP/LPA approved layout/other competent authority?', ynSelect('dtcpApproved', bd.dtcpApproved))}
      ${qrow('(u)', 'If a Building, whether constructed in an approved layout with plan permit/approval?', txt('buildingPlanApproved', bd.buildingPlanApproved))}
      ${qrow('(v)', 'If it is a Flat, mention the undivided share in the property?', txt('udsShare', bd.udsShare))}
      ${qrow('(w)', 'Whether the Building has been assessed to Tax?', ynSelect('taxAssessed', bd.taxAssessed))}
      ${qrow('(x)', 'In whose name the receipts are issued?', txt('taxReceiptName', bd.taxReceiptName))}
      ${qrow('(y)', 'Particulars of Patta/Khatha/Property Tax receipts or equivalent document studied', ynSelect('pattaStudied', bd.pattaStudied))}
      ${qrow('(z)', 'Who is in possession of the property? Since when?', txt('possessionSince', bd.possessionSince))}

      <h3 style="font-size:13.5px;margin:16px 0 8px;">III. Nature of Ownership/Title</h3>
      ${qrow('(a)', 'Free Hold or Lease Hold', `<select class="bob-cascade-select" data-lopath="kvbFormat.data.holdType"><option value="">— select —</option>${sel(['Free Hold','Lease Hold'], bd.holdType)}</select>`)}
      ${bd.holdType==='Lease Hold' ? ['i','ii','iii','iv','v'].map((k,idx)=>qrow(`(a)(${k})`, ['Whether lease deed enables mortgage of the property?','What is the unexpired portion of the lease?','Whether lease deed enables mortgage/sale of the property?','Whether lease rentals paid up to date?','Whether the Lease Deed is registered?'][idx], txt(`leaseholdSub.${k}`, bd.leaseholdSub[k]))).join('') : ''}
      ${qrow('(b)', 'Whether prior permission/NOC required from the Lessor or competent authority?', ynSelect('lessorPermission', bd.lessorPermission))}
      ${qrow('(c)', 'Whether there are any prejudicial/onerous clauses in lease deed?', ynSelect('onerousClause', bd.onerousClause))}
      ${qrow('(d)', 'If free hold, whether the right is absolute or conditional?', txt('freeholdAbsolute', bd.freeholdAbsolute))}
      ${qrow('(e)', 'If acquired through partition, whether original partition deed or registered copy is available', ynSelect('partitionOriginalAvailable', bd.partitionOriginalAvailable))}
      ${qrow('(f)', 'Whether legal flow of title is verified with supportive documents/certificates? (deceased title holder)', ynSelect('deceasedFlowVerified', bd.deceasedFlowVerified))}

      ${qrow('III-A', 'Is the property a Flat?', `<select class="bob-cascade-select" data-lopath="kvbFormat.data.isFlat"><option value="No" ${bd.isFlat==='No'?'selected':''}>No</option><option value="Yes" ${bd.isFlat==='Yes'?'selected':''}>Yes</option></select>`)}
      ${bd.isFlat==='Yes' ? subRows(KVB_FLAT_SUBITEMS, 'flat', '') : ''}

      <h3 style="font-size:13.5px;margin:16px 0 8px;">IV (A). OTHER PARTICULARS</h3>
      ${qrow('(1)', 'Period covered by EC/Search Report', `<p style="font-size:13px;margin:0;">${esc(kvbEcPeriodText(w))}</p><p class="hint">From the Details of EC tab.</p>`)}
      ${qrow('(2)', 'Encumbrances, if any?', `<p style="font-size:13px;margin:0;">${esc(kvbEcNarrative(w))||'<span class="hint">Add Title Tracing text to any Encumbrance Certificate document to populate this.</span>'}</p>`)}
      ${qrow('(3)', 'Whether any additional documents are required to complete the report?', ynSelect('ecAdditionalDocs', bd.ecAdditionalDocs))}
      ${qrow('(4)', 'Nature of Charge to be created', `<select data-lopath="kvbFormat.data.chargeNature"><option value="">— select —</option>${sel(['Simple Mortgage','Equitable Mortgage'], bd.chargeNature)}</select>`)}
      ${qrow('(5)', 'Whether Equitable mortgage is required to be registered with SRO or informed to authorities?', txt('mortgageRegistration', bd.mortgageRegistration))}
      ${qrow('(6)', 'Whether any stamp duty is payable on the confirmation of deposit of title deeds?', ynSelect('stampDutyPayable', bd.stampDutyPayable))}
      ${qrow('(7)', 'Whether required original title deeds are Furnished?', ynSelect('originalsFurnished', bd.originalsFurnished))}

      ${qrow('(5)', 'Whether the Power deed is still in force?', ynSelect('poaInForce', bd.poaInForce))}

      <h3 style="font-size:13.5px;margin:16px 0 8px;">Mode of Acquisition (selects the relevant IV D–I block below)</h3>
      ${qrow('IV', 'How did the title holder acquire the property?', `<select class="bob-cascade-select" data-lopath="kvbFormat.data.acquisitionMode"><option value="">— select —</option>${sel(KVB_ACQUISITION_MODES, bd.acquisitionMode)}</select>`)}

        ${introHtml}

function syncAdditionalDocForRow(doc){
  if(!loWorking.additionalDocs) loWorking.additionalDocs = [];
  const idx = loWorking.additionalDocs.findIndex(a=>a.linkedDocId===doc.id);
  if(!doc.isDocumentExists){
    // Document not yet available — needs to be requested from the client
    const desc = `${docRowDisplayName(doc)} (Document ${doc.slNo||''} — not yet provided by client)`;
    if(idx>=0){
      loWorking.additionalDocs[idx].description = desc;
      if(loWorking.additionalDocs[idx].status==='Received') loWorking.additionalDocs[idx].status = 'Pending';
    } else {
      loWorking.additionalDocs.push({description: desc, status:'Pending', linkedDocId: doc.id});
    }
  } else if(idx>=0){
    // Now exists — mark the requirement as fulfilled rather than deleting the record
    loWorking.additionalDocs[idx].status = 'Received';
  }
}

async function loDocUploadFile(file){
  const code = state.params.code;
  if(!code) return;
  if(file.size > 15*1024*1024){ alert(`"${file.name}" is larger than 15MB.`); return; }
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = `${currentUser.id}/${code}/${Date.now()}_${safeName}`;
  const { error } = await sb.storage.from('service-documents').upload(path, file);
  if(error){ alert('Could not upload: '+error.message); return; }
  captureLoDocModalFields();
  loDocModalRow.storagePath = path;
  loDocModalRow.fileName = file.name;
  loDocModalRow.fileSize = file.size;
  render();
}
function loDocClearUpload(){
  captureLoDocModalFields();
  if(loDocModalRow.storagePath){ sb.storage.from('service-documents').remove([loDocModalRow.storagePath]); }
  loDocModalRow.storagePath = '';
  loDocModalRow.fileName = '';
  loDocModalRow.fileSize = 0;
  render();

async function loUploadDocFile(index, file){
  const code = state.params.code;
  if(!code) return;
  if(file.size > 15*1024*1024){ alert(`"${file.name}" is larger than 15MB.`); return; }
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = `${currentUser.id}/${code}/${Date.now()}_${safeName}`;
  const { error } = await sb.storage.from('service-documents').upload(path, file);
  if(error){ alert('Could not upload: '+error.message); return; }
  const row = loWorking.documentsList[index];
  if(!row) return;
  row.storagePath = path;
  row.fileName = file.name;
  row.fileSize = file.size;
  render();
}
async function loViewDoc(index){
  const row = loWorking.documentsList[index];
  if(!row || !row.storagePath) return;
  const { data, error } = await sb.storage.from('service-documents').createSignedUrl(row.storagePath, 3600);
  if(error){ alert('Could not open document: '+error.message); return; }
  previewDoc = { url: data.signedUrl, fileName: row.fileName||'Document', docType: 'Legal Opinion Document' };
  render();
}
async function loDownloadDoc(index){
  const row = loWorking.documentsList[index];
  if(!row || !row.storagePath) return;
  const { data, error } = await sb.storage.from('service-documents').createSignedUrl(row.storagePath, 3600, {download: row.fileName||true});
  if(error){ alert('Could not download document: '+error.message); return; }
  window.open(data.signedUrl, '_blank');
}
async function loDeleteSelectedDocs(){
  const checked = Array.from(document.querySelectorAll('.lo-doc-check:checked')).map(c=>Number(c.dataset.index));
  if(checked.length===0){ alert('Select at least one document to delete first.'); return; }
  if(!confirm(`Delete ${checked.length} selected document(s)?`)) return;
  const toRemove = checked.map(i=>loWorking.documentsList[i]).filter(Boolean);
  for(const row of toRemove){
    if(row.storagePath){ await sb.storage.from('service-documents').remove([row.storagePath]); }
  }
  loWorking.documentsList = loWorking.documentsList.filter((_,i)=>!checked.includes(i));
  render();
}

const LO_SECTIONS = {
  title_holders: { label:'Title Holders', cols:['title_holders'] },
  documents_list: { label:'Documents List', cols:['documents_list','title_tracing_intro'] },
  additional_documents: { label:'Additional Documents Required', cols:['additional_documents'] },
  property_schedule: { label:'Description of Property', cols:['property_schedules','property_survey_no','property_extent','property_village','property_taluk','property_district','boundary_north','boundary_south','boundary_east','boundary_west','property_nature','property_other_details'] },
  ec_details: { label:'Details of EC', cols:['ec_number','ec_period_from','ec_period_to','ec_issuing_office','ec_transactions'] },
  template: { label:'Template & Final Details', cols:['opinion_conclusion','opinion_remarks','opinion_place','opinion_date','bank_format_enabled','bank_branch_id','bank_format_data','private_format_data','boi_format_data','cbi_format_data','kvb_format_data'] }
};
async function saveLoSection(sectionKey){
  const sectionDef = LO_SECTIONS[sectionKey];
  const code = state.params.code;
  const existing = state.legalOpinions.find(l=>l.serviceCode===code);
  const fullPayload = loToDb(code, loWorking);

  let reason = '';
  if(!isFirmOwner && existing){
    reason = prompt(`Please briefly explain what changed in "${sectionDef.label}" (required for approval):`) || '';
    if(!reason.trim()){ alert('A reason is required to submit this change for approval.'); return; }
  }

  try{
    if(!existing){
      // Nothing saved for this Legal Opinion at all yet — the first section
      // saved creates the base record (with everything currently in loWorking).
      const result = await submitOrExecute({
        taskType:'legal_opinion', action:'create', targetTable:'legal_opinions', targetId:null,
        payload: fullPayload, recordLabel:`Legal Opinion — ${code} (${sectionDef.label})`, section: sectionKey
      });
      if(result.bypassed){
        const mapped = loFromDb(result.data);
        state.legalOpinions.push(mapped);
        loWorking = mapped;
        loSavedOnce = true;
        alert(`"${sectionDef.label}" saved.`);
      } else {
        alert(`"${sectionDef.label}" submitted for approval. This Legal Opinion will be created once approved.`);
      }
    } else {
      const existingDb = loToDb(code, existing);
      const partialPayload = {}; sectionDef.cols.forEach(c=>{ partialPayload[c] = fullPayload[c]; });
      const previousSnapshot = {}; sectionDef.cols.forEach(c=>{ previousSnapshot[c] = existingDb[c]; });
      const result = await submitOrExecute({
        taskType:'legal_opinion', action:'edit', targetTable:'legal_opinions', targetId: existing.id,
        payload: partialPayload, previousSnapshot, recordLabel:`Legal Opinion — ${code} (${sectionDef.label})`, reason, section: sectionKey
      });
      if(result.bypassed){
        const { data } = await sb.from('legal_opinions').select('*').eq('id', existing.id).single();
        const mapped = loFromDb(data);
        const idx = state.legalOpinions.findIndex(l=>l.serviceCode===code);
        state.legalOpinions[idx] = mapped;
        loWorking = mapped;
        loSavedOnce = true;
        alert(`"${sectionDef.label}" saved.`);
      } else {
        alert(`"${sectionDef.label}" submitted for approval. This section will update once approved.`);
      }
    }
    render();
  }catch(err){
    alert('Could not save: '+err.message);
  }
}
async function saveLegalOpinion(){
  return saveLoSection('template');
}

    if(file) loUploadDocFile(idx, file);

  if(e.target.id==='docFileInput'){

    if(file) loDocUploadFile(file);
  }
}

function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'signin': doLoginSubmit('signin'); break;
    case 'signup': doLoginSubmit('signup'); break;
    case 'switch-login': loginMode='signin'; loginMessage=null; render(); break;
    case 'switch-signup': loginMode='signup'; loginMessage=null; render(); break;
    case 'switch-reset': loginMode='reset'; loginMessage=null; render(); break;
    case 'request-password-reset': doPasswordResetRequest(); break;
    case 'open-help': helpModalOpen = true; render(); break;
    case 'close-help': helpModalOpen = false; render(); break;
    case 'logout': doSignOut(); break;
    case 'save-staff-profile': saveStaffProfile(); break;
    case 'set-new-password': setNewPassword(); break;

    case 'nav': {
      const view = el.dataset.view;
      const params = {};
      if(el.dataset.doctype) params.docType = el.dataset.doctype;
      if(el.dataset.code) params.code = el.dataset.code;
      if(el.dataset.editcode) params.editCode = el.dataset.editcode;
      if(el.dataset.editid) params.editId = el.dataset.editid;
      if(el.dataset.branch) params.branch = el.dataset.branch;
      if(el.dataset.date) params.date = el.dataset.date;
      if(view==='client-form'){ pendingClientDocs = []; }
      navigate(view, params);
      break;
    }
    case 'open-service': navigate('service-detail', {code: el.dataset.code}); break;
    case 'save-service': saveService(el.dataset.editcode||null); break;
    case 'services-filter': navigate('services-list', {status: el.dataset.status, sort: state.params.sort||'desc'}); break;
    case 'save-staff': saveStaff(el.dataset.editid||null); break;
    case 'lo-switch-tab': loActiveTab = el.dataset.tab; render(); break;
    case 'save-lo-section': saveLoSection(el.dataset.section); break;
    case 'lo-select-template': {
      loSelectedTemplate = el.dataset.template;
      if(loSelectedTemplate==='bob'){
        if(!loWorking.bankFormat) loWorking.bankFormat = {enabled:true, bankId:''};
        loWorking.bankFormat.enabled = true;
      }
      render();
      break;
    }
    case 'lo-back-to-templates': loSelectedTemplate = null; render(); break;
    case 'bob-use-suggested-cert1': loWorking.bankFormat.data.searchCertPara1 = bobSuggestedSearchCertPara1(loWorking); render(); break;
    case 'bob-use-suggested-cert2': loWorking.bankFormat.data.searchCertPara2 = bobSuggestedSearchCertPara2(loWorking); render(); break;
    case 'download-bob-word': downloadBobAsWord(el.dataset.code); break;
    case 'private-use-suggested-ec': loWorking.privateFormat.data.ecNarrative = privateSuggestedEcNarrative(loWorking); render(); break;
    case 'private-use-suggested-ceiling': loWorking.privateFormat.data.ceilingActText = privateSuggestedCeilingText(loWorking); render(); break;
    case 'download-private-word': downloadPrivateAsWord(el.dataset.code); break;
    case 'download-boi-word': downloadBoiAsWord(el.dataset.code); break;
    case 'cbi-use-suggested-ec': loWorking.cbiFormat.data.ecNarrative = cbiSuggestedEcNarrative(loWorking); render(); break;
    case 'download-cbi-word': downloadCbiAsWord(el.dataset.code); break;
    case 'download-cbi-e-word': downloadCbiAnnexureEAsWord(el.dataset.code); break;
    case 'download-kvb-word': downloadKvbAsWord(el.dataset.code); break;
    case 'lo-add-row': loWorking[el.dataset.array].push({...LO_ROW_TEMPLATES[el.dataset.array]}); render(); break;
    case 'lo-remove-row': {
      const arr = loWorking[el.dataset.array];
      const idx = Number(el.dataset.index);
      const row = arr[idx];
      if(row && row.storagePath){ sb.storage.from('service-documents').remove([row.storagePath]); }
      if(el.dataset.array==='documentsList' && row && row.id){
        loWorking.additionalDocs = (loWorking.additionalDocs||[]).filter(a=>a.linkedDocId!==row.id);
      }
      arr.splice(idx,1);
      render();
      break;
    }
    case 'lo-move-row': {
      const arr = loWorking[el.dataset.array];
      const i = Number(el.dataset.index);
      const j = i + Number(el.dataset.dir);

/* ---------- save / delete logic ---------- */
function friendlyDbError(error){
  if(error && error.code==='23505'){
    if(/clients_pan_unique/.test(error.message)) return 'A client with this PAN already exists — please check the Clients list to avoid a duplicate entry.';
    if(/clients_ifsc_unique/.test(error.message)) return 'A client with this IFSC code already exists — please check the Clients list to avoid a duplicate entry.';
    return 'This record already exists — please check for a duplicate.';
  }
  return error ? error.message : 'Something went wrong.';
}

/* ---------- KYC document handling (Supabase Storage) ---------- */
let clientDocsCache = {};
function docFromDb(r){
  return { id:r.id, clientId:r.client_id, docType:r.doc_type, fileName:r.file_name, storagePath:r.storage_path,
    fileSize:r.file_size, uploadedAt:r.uploaded_at };
}
async function loadClientDocuments(clientId){
  const { data, error } = await sb.from('client_documents').select('*').eq('client_id', clientId).order('uploaded_at', {ascending:false});
  clientDocsCache[clientId] = error ? [] : data.map(docFromDb);
  if(state.view==='client-detail' && state.params.id===clientId) render();
}
async function uploadFilesToClient(clientId, docType, files){
  for(const file of files){
    if(file.size > 10*1024*1024){ alert(`"${file.name}" is larger than 10MB and was skipped.`); continue; }
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path = `${currentUser.id}/${clientId}/${Date.now()}_${safeName}`;
    const { error: upErr } = await sb.storage.from('client-kyc').upload(path, file);
    if(upErr){ alert(`Could not upload "${file.name}": ${upErr.message}`); continue; }
    const { error: metaErr } = await sb.from('client_documents').insert({
      client_id: clientId, doc_type: docType, file_name: file.name, storage_path: path, file_size: file.size
    });
    if(metaErr){ alert(`Uploaded "${file.name}" but could not save its record: ${metaErr.message}`); }
  }
  await loadClientDocuments(clientId);
}
async function handleKycUpload(clientId){
  const input = document.getElementById('kycFileInput');
  const docType = document.getElementById('kycDocType').value || 'Other';
  const files = Array.from(input.files||[]);
  if(files.length===0) return;
  await uploadFilesToClient(clientId, docType, files);
  input.value = '';
}
async function uploadProofFile(clientId, docType, inputEl){
  const files = Array.from(inputEl.files||[]);
  if(files.length===0) return;
  await uploadFilesToClient(clientId, docType, files);
  inputEl.value = '';
  alert(`${docType} uploaded and saved under this client's KYC Documents.`);
}
async function viewKycDocument(path, fileName, docType){
  const { data, error } = await sb.storage.from('client-kyc').createSignedUrl(path, 3600);
  if(error){ alert('Could not open document: '+error.message); return; }
  previewDoc = { url: data.signedUrl, fileName: fileName||'Document', docType: docType||'' };
  render();
}
async function deleteKycDocument(docId, clientId, path){
  if(!confirm('Delete this document? This cannot be undone.')) return;
  await sb.storage.from('client-kyc').remove([path]);
  const { error } = await sb.from('client_documents').delete().eq('id', docId);
  if(error){ alert('Could not delete: '+error.message); return; }
  await loadClientDocuments(clientId);
}

async function saveClient(editId){
  const name = document.getElementById('clName').value.trim();
  const clientType = document.getElementById('clType').value;
  const cat = clientCategory(clientType);
  const signatoryField = document.getElementById('clSignatory');
  const signatory = signatoryField ? signatoryField.value.trim() : '';
  const pan = document.getElementById('clPan').value.trim().toUpperCase();
  const ifsc = document.getElementById('clIfsc').value.trim().toUpperCase();
  const aadhaarLast4 = document.getElementById('clAadhaarLast4').value.trim().replace(/\D/g,'').slice(0,4);
  const phone = document.getElementById('clPhone').value.trim();
  const address = document.getElementById('clAddress').value.trim();
  const pincode = document.getElementById('clPincode').value.trim();
  const email = document.getElementById('clEmail').value.trim();
  const gstRegistered = document.getElementById('clGstRegistered').checked;
  const gstin = document.getElementById('clGstin').value.trim();
  const notes = document.getElementById('clNotes').value.trim();
  if(!name){ alert('Client name is required.'); return; }
  if(cat==='corporate' && !pan){ alert('PAN is required for this entity type.'); return; }
  if(cat==='bank' && !ifsc){ alert('IFSC code is required for a Bank client.'); return; }
  if(cat==='individual' && !pan && !aadhaarLast4){ alert('Please enter either PAN or Aadhaar (last 4 digits) to help avoid duplicate entries.'); return; }

  if(editId){
    const cl = state.clients.find(c=>c.id===editId);
    const updated = Object.assign({}, cl, {name,clientType,signatory,pan,ifsc,aadhaarLast4,phone,address,pincode,email,gstRegistered,gstin,notes});
    let reason = '';
    if(!isFirmOwner){
      reason = prompt('Please explain why this client record needs to be changed (required for approval):') || '';
      if(!reason.trim()){ alert('A reason is required to submit this change for approval.'); return; }
    }
    try{
      const result = await submitOrExecute({ taskType:'client', action:'edit', targetTable:'clients', targetId:cl.id,
        payload: clientToDb(updated), previousSnapshot: clientToDb(cl), recordLabel: name, reason });
      if(result.bypassed){ Object.assign(cl, updated); navigate('client-detail', {id: cl.id}); }
      else { alert('Change submitted for approval. The client record will update once approved.'); navigate('client-detail', {id: cl.id}); }
    }catch(err){ alert('Could not save client: '+friendlyDbError(err)); }
  } else {
    const draft = {name,clientType,signatory,pan,ifsc,aadhaarLast4,phone,address,pincode,email,gstRegistered,gstin,notes};
    try{
      const result = await submitOrExecute({ taskType:'client', action:'create', targetTable:'clients', targetId:null,
        payload: clientToDb(draft), recordLabel: name });
      if(result.bypassed){
        const cl = clientFromDb(result.data);
        state.clients.push(cl);
        if(pendingClientDocs.length>0){
          for(const item of pendingClientDocs){ await uploadFilesToClient(cl.id, item.docType, [item.file]); }
          pendingClientDocs = [];
        }
        navigate('client-detail', {id: cl.id});
      } else {
        pendingClientDocs = [];
        alert('Submitted for approval. This client will appear in your list once approved. (KYC documents can be added after approval.)');
        navigate('clients', {});
      }
    }catch(err){ alert('Could not save client: '+friendlyDbError(err)); }
  }
}
async function deleteClient(id){
  const linked = clientServiceCodes(id);
  if(linked.length>0){ alert(`This client has ${linked.length} service code(s) linked. Remove or reassign those first before deleting the client.`); return; }
  const cl = state.clients.find(c=>c.id===id);
  let reason = '';
  if(!isFirmOwner){
    reason = prompt('Please explain why this client should be deleted (required for approval):') || '';
    if(!reason.trim()){ alert('A reason is required to submit this for approval.'); return; }
  } else {
    if(!confirm('Delete this client? This cannot be undone.')) return;
  }
  try{
    const result = await submitOrExecute({ taskType:'client', action:'delete', targetTable:'clients', targetId:id,
      previousSnapshot: cl?clientToDb(cl):null, recordLabel: cl?cl.name:'', reason });
    if(result.bypassed){ state.clients = state.clients.filter(c=>c.id!==id); navigate('clients', {}); }
    else { alert('Deletion submitted for approval.'); navigate('clients', {}); }
  }catch(err){ alert('Could not delete: '+err.message); }
}

async function saveStaff(editId){
  const name = document.getElementById('stfName').value.trim();
  if(!name){ alert('Staff name is required.'); return; }
  const staffId = document.getElementById('stfStaffId').value.trim();
  const branch = document.getElementById('stfBranch').value;
  const designation = document.getElementById('stfDesignation').value.trim();
  const phone = document.getElementById('stfPhone').value.trim();
  const email = document.getElementById('stfEmail').value.trim();
  const active = document.getElementById('stfActive').checked;
  const workflowRole = document.getElementById('stfWorkflowRole').value;

  const permissions = {};
  document.querySelectorAll('.perm-check').forEach(chk=>{
    permissions[chk.dataset.group+'.'+chk.dataset.perm] = chk.checked;
  });

  if(editId){
    const st = state.staff.find(s=>s.id===editId);
    if(!st){ alert('Staff member not found.'); return; }
    Object.assign(st, {name, staffId, branch, designation, phone, email, active, permissions, workflowRole});
    const { error } = await sb.from('staff').update(staffToDb(st)).eq('id', st.id);
    if(error){ alert('Could not save staff: '+error.message); return; }
  } else {
    const draft = {name, staffId, branch, designation, phone, email, active, permissions, workflowRole};
    const { data, error } = await sb.from('staff').insert(staffToDb(draft)).select().single();
    if(error){ alert('Could not save staff: '+error.message); return; }
    state.staff.push(staffFromDb(data));
  }
  navigate('staff-list', {});
}
async function deleteStaff(id){
  if(!confirm('Delete this staff member? This cannot be undone.')) return;
  const { error } = await sb.from('staff').delete().eq('id', id);
  if(error){ alert('Could not delete: '+error.message); return; }
  state.staff = state.staff.filter(s=>s.id!==id);
  if(previewStaffId===id) previewStaffId = null;
  render();
}
async function inviteStaff(id){
  const s = state.staff.find(x=>x.id===id);
  if(!s) return;
  if(!s.email){ alert('Add an email address for this staff member first (Edit Staff), then invite them.'); return; }
  if(!confirm(`Send a login invitation to ${s.name} at ${s.email}? They'll receive an email to set their own password.`)) return;
  try{
    await callStaffAccessFunction({ action:'invite', email:s.email, staffId:s.id, name:s.name });
    alert(`Invitation sent to ${s.email}.`);
    await logActivity('create','staff', `Invited ${s.name} (${s.email}) to log in`);
    const { data } = await sb.from('staff').select('*').eq('id', id).single();
    if(data){ Object.assign(s, staffFromDb(data)); }
    render();
  }catch(err){
    alert('Could not send invite: '+err.message);
  }
}
async function setStaffAccess(id, action){
  const s = state.staff.find(x=>x.id===id);
  if(!s || !s.userId) return;
  const verb = action==='deactivate' ? 'disable' : 're-enable';
  if(!confirm(`Are you sure you want to ${verb} the login for ${s.name}?`)) return;
  try{
    await callStaffAccessFunction({ action, userId:s.userId });
    await logActivity(action==='deactivate'?'update':'update','staff', `${action==='deactivate'?'Disabled':'Re-enabled'} login for ${s.name}`);
    const { data } = await sb.from('staff').select('*').eq('id', id).single();
    if(data){ Object.assign(s, staffFromDb(data)); }
    render();
  }catch(err){
    alert('Could not '+verb+' login: '+err.message);
  }
}

        payload: scToDb(updated), previousSnapshot: scToDb(sc), recordLabel: sc.code, reason });

      else { alert('Change submitted for approval. This Service Code will update once approved.'); navigate('service-detail', {code: sc.code}); }

  } else {
    const clientSel = document.getElementById('svcClient');

    if(!clientId){ alert('Please select a client.'); return; }

async function saveInvoice(docType, editId){
  const serviceCode = document.getElementById('invServiceCode').value;
  if(!serviceCode){ alert('Please select or create a Service Code first.'); return; }
  const date = document.getElementById('invDate').value || todayISO();
  const sc = state.serviceCodes.find(c=>c.code===serviceCode) || {};
  const clientName = document.getElementById('invClientName').value.trim() || sc.clientName || '';
  const clientAddress = document.getElementById('invClientAddress').value.trim();
  const clientPhone = document.getElementById('invClientPhone').value.trim();
  const clientEmail = document.getElementById('invClientEmail').value.trim();
  const clientGstRegistered = document.getElementById('invGstRegistered').checked;
  const clientGstin = document.getElementById('invClientGstin').value.trim();
  const notes = document.getElementById('invNotes').value.trim();
  const items = formItems.filter(it=>it.description && Number(it.rate)>0).map(it=>({description:it.description, notes:it.notes||'', rate:Number(it.rate), gstRate:Number(it.gstRate)||0}));
  if(items.length===0){ alert('Please add at least one line item with a rate.'); return; }
  const totals = recalcTotals();

  if(editId){
    const inv = state.invoices.find(i=>i.id===editId);
    const updated = Object.assign({}, inv, {serviceCode,date,clientName,notes,clientAddress,clientPhone,clientEmail,clientGstRegistered,clientGstin,
      items, gstEnabled:totals.gstOn, subtotal:totals.subtotal, gstAmount:totals.gstAmt, total:totals.total});
    updated.paidAmount = Math.min(inv.paidAmount, updated.total);
    if(updated.paidAmount < updated.total) updated.closed = false;
    let reason = '';
    if(!isFirmOwner){
      reason = prompt('Please explain why this document needs to be changed (required for approval):') || '';
      if(!reason.trim()){ alert('A reason is required to submit this change for approval.'); return; }
    }
    try{
      const result = await submitOrExecute({ taskType:'invoice', action:'edit', targetTable:'invoices', targetId:inv.id,
        payload: invToDb(updated), previousSnapshot: invToDb(inv), recordLabel: inv.docNo, reason });
      if(!result.bypassed){ alert('Change submitted for approval. This document will update once approved.'); navigate('service-detail', {code: serviceCode}); return; }
      Object.assign(inv, updated);
    }catch(err){ alert('Could not save invoice: '+err.message); return; }
  } else {
    const draft = {
      docType, docNo: genDocNo(docType), serviceCode, date, clientName, notes,
      clientAddress, clientPhone, clientEmail, clientGstRegistered, clientGstin,
      items, gstEnabled: totals.gstOn, subtotal: totals.subtotal, gstAmount: totals.gstAmt,
      total: totals.total, paidAmount: 0, closed: false
    };
    try{
      const result = await submitOrExecute({ taskType:'invoice', action:'create', targetTable:'invoices', targetId:null,
        payload: invToDb(draft), recordLabel: draft.docNo });
      if(!result.bypassed){ alert('Submitted for approval. This document will appear once approved.'); navigate('service-detail', {code: serviceCode}); return; }
      state.invoices.push(invFromDb(result.data));
    }catch(err){ alert('Could not save invoice: '+err.message); return; }
  }
  navigate('service-detail', {code: serviceCode});
}

async function saveReceipt(editId){
  const serviceCode = document.getElementById('recServiceCode').value;
  if(!serviceCode){ alert('Please select or create a Service Code first.'); return; }
  const invoiceId = document.getElementById('recInvoiceId').value || null;
  const amount = Number(document.getElementById('recAmount').value)||0;
  const mode = document.getElementById('recMode').value;
  const notes = document.getElementById('recNotes').value.trim();
  const date = document.getElementById('recDate').value || todayISO();
  if(amount<=0){ alert('Please enter a valid amount.'); return; }

  if(editId){
    const old = state.receipts.find(r=>r.id===editId);
    const updated = Object.assign({}, old, {serviceCode,invoiceId,amount,mode,notes,date});
    let reason = '';
    if(!isFirmOwner){
      reason = prompt('Please explain why this receipt needs to be changed (required for approval):') || '';
      if(!reason.trim()){ alert('A reason is required to submit this change for approval.'); return; }
    }
    try{
      const result = await submitOrExecute({ taskType:'receipt', action:'edit', targetTable:'receipts', targetId:old.id,
        payload: recToDb(updated), previousSnapshot: recToDb(old), recordLabel: `Receipt ₹${amount}`, reason });
      if(!result.bypassed){ alert('Change submitted for approval. Invoice balances will update once approved.'); navigate('service-detail', {code: serviceCode}); return; }
      if(old.invoiceId){ await unapplyReceipt(old); }
      Object.assign(old, updated);
      if(invoiceId){ await applyReceipt(old); }
    }catch(err){ alert('Could not save receipt: '+err.message); return; }
  } else {
    const draft = {serviceCode, invoiceId, amount, mode, notes, date};
    try{
      const result = await submitOrExecute({ taskType:'receipt', action:'create', targetTable:'receipts', targetId:null,
        payload: recToDb(draft), recordLabel: `Receipt ₹${amount}` });
      if(!result.bypassed){ alert('Submitted for approval. This receipt — and the invoice balance it affects — will update once approved.'); navigate('service-detail', {code: serviceCode}); return; }
      const rec = recFromDb(result.data);
      state.receipts.push(rec);
      if(invoiceId){ await applyReceipt(rec); }
    }catch(err){ alert('Could not save receipt: '+err.message); return; }
  }

  if(invoiceId){
    const inv = state.invoices.find(i=>i.id===invoiceId);
    if(inv && !inv.closed && inv.paidAmount >= inv.total){
      const wantsClose = confirm(`Full payment received for ${inv.docNo}. Do you want to close this invoice?\n\nIt will then be removed from the Pending Invoices list.`);
      if(wantsClose){ inv.closed = true; await sb.from('invoices').update({closed:true}).eq('id', inv.id); }
    }
  }
  navigate('service-detail', {code: serviceCode});
}
async function applyReceipt(rec){
  const inv = state.invoices.find(i=>i.id===rec.invoiceId);
  if(inv){
    inv.paidAmount = Math.min(inv.total, (inv.paidAmount||0) + Number(rec.amount));
    if(inv.paidAmount < inv.total) inv.closed = false;
    await sb.from('invoices').update({paid_amount:inv.paidAmount, closed:inv.closed}).eq('id', inv.id);
  }
}
async function unapplyReceipt(rec){
  const inv = state.invoices.find(i=>i.id===rec.invoiceId);
  if(inv){
    inv.paidAmount = Math.max(0, (inv.paidAmount||0) - Number(rec.amount));
    if(inv.paidAmount < inv.total) inv.closed = false;
    await sb.from('invoices').update({paid_amount:inv.paidAmount, closed:inv.closed}).eq('id', inv.id);
  }
}
async function deleteReceipt(id){
  const rec = state.receipts.find(r=>r.id===id);
  let reason = '';
  if(!isFirmOwner){
    reason = prompt('Please explain why this receipt should be deleted (required for approval):') || '';
    if(!reason.trim()){ alert('A reason is required to submit this for approval.'); return; }
  } else {
    if(!confirm('Delete this receipt? Linked invoice balance will be restored.')) return;
  }
  try{
    const result = await submitOrExecute({ taskType:'receipt', action:'delete', targetTable:'receipts', targetId:id,
      previousSnapshot: rec?recToDb(rec):null, recordLabel: rec?`Receipt ₹${rec.amount}`:'', reason });
    if(result.bypassed){
      if(rec && rec.invoiceId) await unapplyReceipt(rec);
      state.receipts = state.receipts.filter(r=>r.id!==id);
      render();
    } else { alert('Deletion submitted for approval.'); render(); }
  }catch(err){ alert('Could not delete: '+err.message); }
}

  if(state[list].includes(val)){ alert('This item already exists.'); return; }
  const { error } = await sb.from(MASTER_TABLES[list]).insert({name:val, sort_order: state[list].length});

  state[list].push(val);

  if(error){ alert('Could not remove: '+error.message); return; }
  state[list].splice(index,1);
  render();
}

function handleLocationFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {defval:''});
      const norm = json.map(row=>{
        const get = (key) => {
          const k = Object.keys(row).find(rk=>rk.trim().toLowerCase()===key);
          return k ? String(row[k]).trim() : '';
        };
        return {
          state: get('state') || 'Tamil Nadu',
          district: get('district'),
          taluk: get('taluk'),
          village: get('village'),
          corporation: get('corporation'),
          municipality: get('municipality')
        };
      }).filter(r=>r.district);
      if(norm.length===0){ alert('No valid rows found. Make sure the file has a District column with values.'); return; }
      locStagedRows = norm;
      render();
    }catch(err){
      alert('Could not read this file: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}
async function confirmLocationImport(){
  if(!locStagedRows || locStagedRows.length===0) return;
  const rows = locStagedRows.map(locationToDb);
  const batchSize = 500;
  let inserted = [];
  for(let i=0;i<rows.length;i+=batchSize){
    const batch = rows.slice(i, i+batchSize);
    const { data, error } = await sb.from('master_locations').insert(batch).select();
    if(error){ alert(`Import stopped partway due to an error: ${error.message}\n\n${inserted.length} row(s) were saved before this happened.`); break; }
    inserted = inserted.concat(data||[]);
  }
  state.locations = state.locations.concat(inserted.map(locationFromDb));
  locStagedRows = null;
  render();
  alert(`Imported ${inserted.length} location entries.`);
}
function cancelLocationImport(){
  locStagedRows = null;
  render();
}

function handleBankFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {defval:''});
      const norm = json.map(row=>{
        const get = (key) => {
          const k = Object.keys(row).find(rk=>rk.trim().toLowerCase()===key);
          return k ? String(row[k]).trim() : '';
        };
        return {
          bankName: get('bank name'),
          branchName: get('branch name'),
          ifscCode: get('ifsc code'),
          branchAddress: get('branch address'),
          email: get('email'),
          contactNo: get('contact no'),
          managerName: get('manager name'),
          managerContactNo: get('manager contact no'),
          remarks: get('remarks')
        };
      }).filter(r=>r.bankName && r.branchName);
      if(norm.length===0){ alert('No valid rows found. Make sure the file has Bank Name and Branch Name columns with values.'); return; }
      bankStagedRows = norm;
      render();
    }catch(err){
      alert('Could not read this file: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- Branch Day Book: save/delete functions ---------- */
async function saveDayBookOpening(cash, account){
  dbWorking.dayBook.openingCash = cash;
  dbWorking.dayBook.openingAccount = account;
  const { error } = await sb.from('branch_day_books').update({opening_cash:cash, opening_account:account}).eq('id', dbWorking.dayBook.id);
  if(error){ alert('Could not save opening balance: '+error.message); return; }
  const idx = state.dayBooks.findIndex(d=>d.id===dbWorking.dayBook.id);
  if(idx>=0) state.dayBooks[idx] = {...dbWorking.dayBook};
  render();
}
async function runEOD(){
  if(!confirm('Run End of Day? This closes today\'s ledger and locks further edits. You can reopen it later if a correction is needed.')) return;
  const t = dbComputeTotals();
  const eodCompletedAt = new Date().toISOString();
  const { error } = await sb.from('branch_day_books').update({
    status:'Closed', eod_completed_at:eodCompletedAt, eod_closing_cash:t.closingCash, eod_closing_account:t.closingAccount
  }).eq('id', dbWorking.dayBook.id);
  if(error){ alert('Could not complete EOD: '+error.message); return; }
  dbWorking.dayBook.status = 'Closed';
  dbWorking.dayBook.eodCompletedAt = eodCompletedAt;
  dbWorking.dayBook.eodClosingCash = t.closingCash;
  dbWorking.dayBook.eodClosingAccount = t.closingAccount;
  const idx = state.dayBooks.findIndex(d=>d.id===dbWorking.dayBook.id);
  if(idx>=0) state.dayBooks[idx] = {...dbWorking.dayBook};
  render();
}
async function reopenDayBook(){
  if(!confirm('Reopen this day for corrections?')) return;
  const { error } = await sb.from('branch_day_books').update({status:'Open'}).eq('id', dbWorking.dayBook.id);
  if(error){ alert('Could not reopen: '+error.message); return; }
  dbWorking.dayBook.status = 'Open';
  const idx = state.dayBooks.findIndex(d=>d.id===dbWorking.dayBook.id);
  if(idx>=0) state.dayBooks[idx].status = 'Open';
  render();
}
async function saveDbTxnModal(){
