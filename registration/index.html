<style>
/* Layout: practice banner → top bar → page stage; wizard = main tab strip + child tab strip + form card + sticky action bar */
:root{
  --bg:#F1F6F5; --panel:#ffffff; --ink:#000000; --muted:#5f6b72; --line:#DBE9F1; --soft:#D6EDF9;
  --accent:#0170D7; --accent-ink:#ffffff; --accent-soft:#EAF8FF; --nav:#37518F; --band:#D5F1FF; --tabgrey:#8e999f;
  --warn:#8a5a00; --warn-soft:#fff4dc; --err:#C00; --ok:#1f7a4d; --req:#C00;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Poppins",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1621; --panel:#15202d; --ink:#e6edf3; --muted:#9fb0bf; --line:#2a3a4c; --soft:#1b2c40;
  --accent:#4ea3f5; --accent-ink:#04182c; --accent-soft:#16283c; --nav:#22355f; --band:#17304a; --tabgrey:#8b98a5;
  --warn:#f0b354; --warn-soft:#2c2414; --err:#ff8a80; --ok:#62c995; --req:#ff7b7f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1621; --panel:#15202d; --ink:#e6edf3; --muted:#9fb0bf; --line:#2a3a4c; --soft:#1b2c40;
  --accent:#4ea3f5; --accent-ink:#04182c; --accent-soft:#16283c; --nav:#22355f; --band:#17304a; --tabgrey:#8b98a5;
  --warn:#f0b354; --warn-soft:#2c2414; --err:#ff8a80; --ok:#62c995; --req:#ff7b7f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.ribbon{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);font-size:13px;padding-block:6px;padding-inline:16px;text-align:center}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;margin:0 -16px 0;background:linear-gradient(to right,var(--panel),var(--accent-soft));border-bottom:3px solid var(--nav)}
.topband{background:var(--nav);height:6px}
.brand{font-family:var(--f-disp);font-size:19px;font-weight:600;color:var(--nav)}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav button{border:0;border-bottom:3px solid transparent;background:transparent;color:var(--ink);border-radius:0;padding:6px 12px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.nav button:hover{color:var(--accent)}
.nav button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.crumb{font-size:13px;color:var(--muted);margin:0 -16px 12px;padding:7px 16px;background:var(--band)}
.crumb b{color:var(--ink)}
.card{background:var(--panel);border:0;border-radius:10px;padding:16px 20px;box-shadow:0 2px 3px 1px #21212112}
h1{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;font-weight:600;margin:18px 0 8px}
h3{font-size:1.125rem;font-weight:600;margin:14px 0 6px;color:var(--ink)}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 18px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.lab{font-weight:400;font-size:14px}
.req{color:var(--req)}
.f .note{font-size:12.5px;color:var(--muted)}
.f .alert{font-size:12.5px;color:var(--err)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;font-size:14px;min-height:42px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);box-shadow:0 2px 8px 2px rgba(1,112,215,.1)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgba(102,175,233,.6)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.chk input{margin-top:3px}
.btn{border:1px solid var(--accent);background:linear-gradient(to right,var(--accent) 50%,var(--accent-soft) 50%);background-size:200% 100%;background-position:right bottom;color:var(--accent);border-radius:8px;padding:5px 16px;min-height:32px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background-position .4s,color .2s}
.btn:hover:not(:disabled){background-position:left bottom;color:var(--accent-ink)}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.btn.sec{}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.heading{grid-column:1/-1;font-weight:600;font-size:15px;color:var(--ink);background:var(--soft);border-radius:6px;padding:8px 12px;margin-top:6px}
.pnote{grid-column:1/-1;font-size:13.5px;color:var(--muted);margin:0}
.tblwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600;font-size:12.5px;white-space:nowrap;text-align:center;border-bottom:2px solid #e1e4ed}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.empty{color:var(--muted);text-align:center;padding:14px}
.embed .brand,.embed #signOut,.embed .topband{display:none}
.embed .top{justify-content:flex-start}
.btn.danger{color:var(--err);border-color:var(--err);background:linear-gradient(to right,var(--err) 50%,transparent 50%);background-size:200% 100%;background-position:right bottom}
.btn.danger:hover:not(:disabled){color:#fff}
.subnav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.subnav .tabs{margin:0;flex:1 1 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border-radius:10px;padding:14px 16px;box-shadow:0 2px 3px 1px #21212112;border-left:4px solid var(--accent)}
.stat b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn{border-left-color:var(--warn)}
td.cnt,th.cnt{text-align:center;font-variant-numeric:tabular-nums}
td.cnt button{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:2px 6px;border-radius:4px}
td.cnt button:hover{background:var(--accent-soft)}
tr.tot td{font-weight:600;background:var(--soft)}
tbody tr.pick{cursor:pointer}tbody tr.pick:hover td{background:var(--accent-soft)}
tbody tr.sel td{background:var(--accent-soft)}
.st{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);white-space:nowrap}
.st.draft{background:#eceff1;color:#455a64}.st.awaiting_approval{background:var(--warn-soft);color:var(--warn)}.st.query{background:#fde8e8;color:var(--err)}.st.registered,.st.delivered{background:#e3f4ea;color:var(--ok)}
.hist{list-style:none;margin:0;padding:0;font-size:13px}.hist li{padding:6px 0;border-bottom:1px solid var(--line)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}.filters .f{min-width:180px;flex:1 1 180px}
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px 18px;margin-top:8px}
.docrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.upl{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upl:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.files{list-style:none;margin:0;padding:0;width:100%;font-size:12.5px}
.files li{overflow-wrap:anywhere}.files a{color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-block:4px 10px;scrollbar-width:thin;background:var(--panel);border-bottom:2px solid #e0e0e0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tabs button{flex:0 0 auto;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;background:var(--panel);color:var(--tabgrey);padding:8px 12px;border-radius:0;font:inherit;font-size:15px;font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:center;transition:color .2s}
.tabs button:hover{color:var(--accent)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;cursor:default}
.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tabs .dot.ok{background:var(--ok)}
.tabs.child{box-shadow:none;background:transparent;border-bottom:1px solid var(--line)}
.tabs.child button{background:transparent;font-size:13.5px;padding:6px 12px;border-bottom-width:3px}
.tabs.child button[aria-selected="true"]{background:var(--accent-soft)}
.actions{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;border-radius:0 0 12px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 3px 1px #21212112}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--muted)}
.tile.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tile.primary span{color:var(--accent-ink);opacity:.9}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.ok{color:var(--ok)}
.mono{font-family:var(--f-mono);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.errbox{border:1px solid var(--err);color:var(--err);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.errbox ul{margin:4px 0 0;padding-left:18px}
iframe.prop{width:100%;height:1500px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.preview{white-space:pre-wrap;font-family:var(--f-body);font-size:14.5px;line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--soft);max-height:640px;overflow:auto}
.kv{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:640px){.kv{grid-template-columns:1fr}.card{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="topband"></div>
<div class="ribbon">V Legal registration desk. This is <b>not</b> the TNREGINET portal: nothing here is sent to the Registration Department. Files are saved to the firm's records as you type; scans go to the firm's Google Drive.</div>
<div class="wrap">
  <div class="top">
    <div class="brand">V Legal · Registration Desk<small id="whoami">Presence-less registration</small></div>
    <nav class="nav" aria-label="Pages">
      <button type="button" data-go="dash" aria-current="page">Dashboard</button>
      <button type="button" data-go="docreg">Document Registration</button>
      <button type="button" data-go="users" id="navUsers" hidden>Users</button>
      <button type="button" id="signOut">Sign out</button>
    </nav>
  </div>
  <div class="crumb" id="crumb"></div>
  <div class="subnav" id="subnav" hidden><div class="tabs child" role="tablist"><button type="button" data-sub="new">Create New</button><button type="button" data-sub="drafts">Drafts</button><button type="button" data-sub="mydocs">My Documents</button></div><span class="hint" id="saveState" aria-live="polite"></span></div>
  <main id="stage"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
if(window.top!==window){document.documentElement.classList.add("embed")}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600)}
let SCR=null,OPTS={};
const APP={page:"dash",entry:{},deedType:"",docDesc:"",linked:[],tpCopy:"",tab:0,child:0,vals:{},grids:{},done:{},docs:[]};

/* ---------- deed configuration (tab names exactly as on the portal; unverified ones flagged) ---------- */
const DEEDS={
 "7":{name:"Deposit Of Title Deeds",verified:true,parties:[["Mortgagor/ Depositor","d7_tab1_childTab1","exe"],["Mortgagee","d7_tab1_childTab2","cla"],["Representative Details","d7_tab1_childTab3","rep"],["Witness Details","d7_tab1_childTab4","wit"],["Presenter Details","d7_tab1_childTab5","pre"]],
   tabs:[["Party Details","party"],["Property Details","property"],["Mortgage and Security Details","d7_tab3"],["Details of Documents of Titles Deposited","d7_tab4"],["Possession Remarks","d7_tab5"],["Legal Condition","d7_tab6"],["Reasons for availing Loan","d7_tab7"],["Supporting Details","d7_tab8"],["Document Preview","preview"],["Document Valuation","valuation"]]},
 "1":{name:"Sale deed",verified:true,parties:[["Executant Details","d1_tab1_childTab1","exe"],["Claimant Details","d1_tab1_childTab2","cla"],["Representative Details","d1_tab1_childTab3","rep"],["Witness Details","d1_tab1_childTab4","wit"],["Presenter Details","d1_tab1_childTab5","pre"]],
   tabs:[["Party Details","party"],["Property Details","property"],["Consideration Value","d1_tab3"],["Agreement Detail","agreement"],["Possession Remarks","d1_tab5"],["Legal Condition","d1_tab6"],["Reason For Sale","d1_tab7"],["Supporting Details","d1_tab8"],["Document Preview","preview"],["Document Valuation","valuation"]]},
 "28":{name:"Further Charge Mortgage Without Possession Deed",verified:false,parties:[["Mortgagor/ Depositor","d7_tab1_childTab1","exe"],["Mortgagee","d7_tab1_childTab2","cla"],["Representative Details","d7_tab1_childTab3","rep"],["Witness Details","d7_tab1_childTab4","wit"],["Presenter Details","d7_tab1_childTab5","pre"]],
   tabs:[["Party Details","party"],["Property Details","property"],["Mortgage and Security Details","d7_tab3"],["Possession Remarks","d7_tab5"],["Legal Condition","d7_tab6"],["Reasons for availing Loan","d7_tab7"],["Supporting Details","d7_tab8"],["Document Preview","preview"],["Document Valuation","valuation"]]},
 "22":{name:"Further Charge Mortgage With Possession Deed",verified:false,parties:[["Mortgagor/ Depositor","d7_tab1_childTab1","exe"],["Mortgagee","d7_tab1_childTab2","cla"],["Representative Details","d7_tab1_childTab3","rep"],["Witness Details","d7_tab1_childTab4","wit"],["Presenter Details","d7_tab1_childTab5","pre"]],
   tabs:[["Party Details","party"],["Property Details","property"],["Mortgage and Security Details","d7_tab3"],["Possession Remarks","d7_tab5"],["Legal Condition","d7_tab6"],["Reasons for availing Loan","d7_tab7"],["Supporting Details","d7_tab8"],["Document Preview","preview"],["Document Valuation","valuation"]]},
 "DOR":{name:"Deed of Receipt (MOD Discharge)",verified:false,parties:[["Executant Details (Bank / Mortgagee)","d1_tab1_childTab2","exe"],["Claimant Details (Mortgagor)","d1_tab1_childTab1","cla"],["Representative Details","d7_tab1_childTab3","rep"],["Witness Details","d7_tab1_childTab4","wit"],["Presenter Details","d7_tab1_childTab5","pre"]],
   tabs:[["Party Details","party"],["Property Details","property"],["Receipt Details","receipt"],["Possession Remarks","d7_tab5"],["Supporting Details","d7_tab8"],["Document Preview","preview"],["Document Valuation","valuation"]]}
};
const PARTY_COLS=["Sr. No.","Name","Age","Gender","Party Type","Contact Details","Full Address","Action"];

/* ---------- navigation ---------- */
const GROUP={entry:"new",create:"new",wizard:"new",drafts:"drafts",mydocs:"mydocs"};
function go(p){if(APP.page==="wizard")saveScreen();if(APP.page!==p)scheduleSave(true);APP.page=p;
 $$(".nav button[data-go]").forEach(b=>b.setAttribute("aria-current",(b.dataset.go==="docreg"?!!GROUP[p]:b.dataset.go===p)?"page":"false"));
 $("#subnav").hidden=!GROUP[p];$$("#subnav [data-sub]").forEach(b=>b.setAttribute("aria-selected",GROUP[p]===b.dataset.sub));
 render();window.scrollTo(0,0)}
$$(".nav button[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go==="docreg"?"mydocs":b.dataset.go));
$$("#subnav [data-sub]").forEach(b=>b.onclick=()=>{const k=b.dataset.sub;if(k==="new")return newFile();go(k)});
function crumb(t){$("#crumb").innerHTML=t}
function render(){const p=APP.page;const st=$("#stage");
 if(p==="dash")return renderDash(st);
 if(p==="users")return ME.owner?renderUsers(st):go("dash");
 if(p==="drafts")return renderList(st,"drafts");
 if(p==="entry")return renderEntry(st);
 if(p==="create")return renderCreate(st);
 if(p==="wizard")return renderWizard(st);
 if(p==="mydocs")return renderList(st,"mydocs")}

/* ---------- helpers ---------- */
function optsHTML(list,sel){return (list||[]).map(([v,t])=>`<option value="${esc(v)}"${String(sel)===String(v)?" selected":""}>${esc(t)}</option>`).join("")}
function opts(ref){return typeof ref==="string"?OPTS[ref]||[]:ref||[]}
function findOpts(id){for(const k in SCR.pages)for(const x of SCR.pages[k]){const fs=x.k==="f"?x.fs:x.k==="x"?[x.f]:[];for(const f of fs)if(f.id===id&&f.opts)return opts(f.opts)}return[]}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

/* ---------- 1. Entry details (internal) ---------- */
const ENTRY_FIELDS=[
 ["File","h"],
 ["fileRef","File reference","ro"],["fileDate","File date","date"],["preparedBy","Prepared by"],["checkedBy","Checked by"],
 ["Work","h"],
 ["work","Work type","sel",[["","- Select -"],["7","Deposit of Title Deeds (MOD)"],["DOR","Deed of Receipt (MOD Discharge)"],["1","Sale Deed (first sale of plot / flat)"],["28","Further Charge – without possession"],["22","Further Charge – with possession"]]],
 ["lang","Document language","sel",[["en","English"],["ta","Tamil"]]],["sro","Sub Registrar Office","sro"],["emDate","EM / execution date","date"],
 ["Client & bank","h"],
 ["client","Mortgagor / Buyer name"],["clientMobile","Mobile number"],["bank","Bank / NBFC","bank"],["ifsc","Branch IFSC code","ifsc"],["branch","Branch"],["branchPin","Branch pincode"],["loanAc","Loan account no."],["sanction","Sanction / loan amount (₹)","num"],["branchAddr","Branch address (goes to Mortgagee address)","area"],
 ["Documents received","h"],
 ["docs","","checks",["Title / sale deed","Parent documents","Earlier MOD","Chitta / Patta","Encumbrance Certificate","KYC of all parties","Sanction letter","Loan closure letter (discharge)","Other documents"]],
 ["Remarks","h"],
 ["remarks","Remarks","area"]
];

function prevStatus(s){const order=STATUSES.map(x=>x[0]);if(s==="query")return"submitted";if(s==="registered")return"submitted";const i=order.indexOf(s);let pv=order[Math.max(0,i-1)];if(pv==="query")pv="submitted";return pv}

 f.innerHTML=`<div class="card" style="margin-top:10px;background:var(--accent-soft);box-shadow:none"><h3 style="margin-top:0">${esc(s.label)}</h3>${s.pay?payFields(r.payment):`<div class="grid">${(s.fields||[]).map(([k,l,t,req])=>`<div class="f${t==="area"?" wide":""}"${req?` data-req="1" data-lab="${esc(l)}"`:""}><label for="s_${k}">${esc(l)}${req?' <span class="req">*</span>':""}</label>${t==="area"?`<textarea id="s_${k}" style="min-height:60px"></textarea>`:`<input type="${t==="date"?"date":"text"}" id="s_${k}"${t==="num"?' inputmode="numeric"':""} value="${esc(k==="note"?"":val(k))}">`}</div>`).join("")}</div>`}
  <div class="row" style="margin-top:12px"><button class="btn${s.sec?" sec":""}" type="button" id="sGo">${esc(s.label)}</button><button class="btn sec" type="button" id="sCancel">Cancel</button></div><div id="sErr"></div></div>`;
 if(s.pay){const tot=()=>{const n=k=>parseFloat(String($("#p_"+k).value).replace(/[,₹\s]/g,""))||0;$("#p_total").value=(n("stamp_duty")+n("reg_fee")+n("other")).toLocaleString("en-IN")};["stamp_duty","reg_fee","other"].forEach(k=>$("#p_"+k).oninput=tot);tot()}
 $("#sCancel").onclick=()=>f.innerHTML="";
 $("#sGo").onclick=async()=>{const er=requiredCheck(f);if(er.length)return showErr("#sErr",er);
  const up={status:s.to,last_note:null};
  if(s.pay){const n=k=>{const v=String($("#p_"+k).value).replace(/[,₹\s]/g,"");return v===""?null:+v};up.payment={stamp_duty:n("stamp_duty"),reg_fee:n("reg_fee"),other:n("other"),total:(n("stamp_duty")||0)+(n("reg_fee")||0)+(n("other")||0),date:$("#p_date").value,mode:$("#p_mode").value,ref:$("#p_ref").value.trim(),by:$("#p_by").value,note:$("#p_note").value.trim()};up.last_note="Payment "+rupee(up.payment.total)+" · "+up.payment.mode+" · "+up.payment.ref}
  else for(const [k,,t] of s.fields||[]){const el=$("#s_"+k);const v=el.value.trim();if(k==="note")up.last_note=v||null;else up[k]=v===""?null:t==="num"?+v:v}
  if(s.to==="tp_created")up.last_note=up.tp_no;
  if(s.to==="registered")up.last_note="Registered "+up.reg_doc_no+"/"+up.reg_year;
  $("#sGo").disabled=true;const {data,error}=await sb.from("reg_docs").update(up).eq("id",r.id).select(COLS).single();$("#sGo").disabled=false;
  if(error)return showErr("#sErr",[error.message]);
  ROWS=ROWS.map(x=>x.id===r.id?data:x);toast(STL[s.to]);renderList($("#stage"),"mydocs")}}

/* ---------- dashboard ---------- */
function renderDash(st){crumb("<b>Dashboard</b>"+(ME.owner?" · all staff":" · your files"));st.innerHTML=`<div id="dashBox"><div class="card"><p class="hint">Loading…</p></div></div>`;
 loadRows().then(drawDash).catch(x=>$("#dashBox").innerHTML=`<div class="errbox">Could not load files: ${esc(x.message)}</div>`)}
function drawDash(){const R=ROWS,now=new Date(),mStart=new Date(now.getFullYear(),now.getMonth(),1),tStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const inM=d=>d&&new Date(d)>=mStart,inT=d=>d&&new Date(d)>=tStart;
 const open=R.filter(r=>r.status!=="delivered");const stuck=open.filter(r=>daysSince(r.status_at)>3).sort((a,b)=>new Date(a.status_at)-new Date(b.status_at));
 const paidM=R.filter(r=>r.payment&&inM(r.payment.date));const sum=k=>paidM.reduce((a,r)=>a+(+r.payment[k]||0),0);
 const card=(n,l,cls)=>`<div class="stat${cls?" "+cls:""}"><b>${n}</b><span>${l}</span></div>`;
 const types=[...TYPES.map(t=>t[0]),...(R.some(r=>typeOf(r.deed_type)==="Other")?["Other"]:[])];
 const cnt=(t,s)=>R.filter(r=>(!t||typeOf(r.deed_type)===t)&&(!s||r.status===s)).length;
 const cell=(t,s)=>{const n=cnt(t,s);return `<td class="cnt">${n?`<button type="button" data-t="${esc(t||"")}" data-s="${esc(s||"")}">${n}</button>`:'<span class="hint">0</span>'}</td>`};
 const groupBy=(k)=>{const m={};open.forEach(r=>{const key=r[k]||"(not set)";m[key]=(m[key]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,12)};
 $("#dashBox").innerHTML=`<div class="stats">
  ${ME.owner?card(cnt("","awaiting_approval"),"Awaiting your approval",cnt("","awaiting_approval")?"warn":""):card(cnt("","awaiting_approval"),"Waiting for approval")}
  ${card(R.filter(r=>inT(r.created_at)).length,"Files opened today")}${card(R.filter(r=>inM(r.created_at)).length,"Files opened this month")}
  ${card(R.filter(r=>r.submitted_on&&inM(r.submitted_on)).length,"Submitted this month")}${card(R.filter(r=>r.reg_date&&inM(r.reg_date)).length,"Registered this month")}
  ${card(stuck.length,"Stuck more than 3 days",stuck.length?"warn":"")}${card(rupee(sum("total"))||"₹0","Paid to Govt this month")}</div>
 <div class="card"><h2 style="margin-top:0">Documents by status</h2><p class="sub">Click a number to see those files.</p><div class="tblwrap"><table><thead><tr><th>Document</th>${STATUSES.map(s=>`<th class="cnt">${esc(s[1])}</th>`).join("")}<th class="cnt">Total</th></tr></thead>
  <tbody>${types.map(t=>`<tr><td><b>${esc(t)}</b></td>${STATUSES.map(s=>cell(t,s[0])).join("")}${cell(t,"")}</tr>`).join("")}<tr class="tot"><td>Total</td>${STATUSES.map(s=>cell("",s[0])).join("")}${cell("","")}</tr></tbody></table></div></div>
 <div class="card" style="margin-top:16px"><h2 style="margin-top:0">Stuck files</h2><p class="sub">In the same status for more than 3 days, oldest first.</p>${stuck.length?`<div class="tblwrap"><table><thead><tr><th>File reference</th><th>Document</th><th>Client</th><th>Status</th><th class="cnt">Days</th>${ME.owner?"<th>Staff</th>":""}</tr></thead><tbody>${stuck.slice(0,25).map(r=>`<tr class="pick" data-id="${r.id}" data-st="${r.status}"><td class="mono">${esc(r.file_ref||"")}</td><td>${esc(typeOf(r.deed_type))}</td><td>${esc(r.client||"")}</td><td>${stPill(r.status)}</td><td class="cnt">${daysSince(r.status_at)}</td>${ME.owner?`<td>${who(r.created_by_email)}</td>`:""}</tr>`).join("")}</tbody></table></div>`:'<p class="hint">Nothing stuck.</p>'}</div>
 <div class="split" style="margin-top:16px"><div class="card"><h2 style="margin-top:0">Open files by bank</h2><table><tbody>${groupBy("bank").map(([k,n])=>`<tr><td>${esc(k)}</td><td class="cnt">${n}</td></tr>`).join("")||'<tr><td class="empty">No open files</td></tr>'}</tbody></table></div>
  <div class="card"><h2 style="margin-top:0">Open files by SRO</h2><table><tbody>${groupBy("sro").map(([k,n])=>`<tr><td>${esc(k)}</td><td class="cnt">${n}</td></tr>`).join("")||'<tr><td class="empty">No open files</td></tr>'}</tbody></table></div></div>
 ${paidM.length?`<div class="card" style="margin-top:16px"><h2 style="margin-top:0">Payments this month</h2><dl class="kv"><dt>Stamp duty</dt><dd>${rupee(sum("stamp_duty"))||"₹0"}</dd><dt>Registration fee</dt><dd>${rupee(sum("reg_fee"))||"₹0"}</dd><dt>Other charges</dt><dd>${rupee(sum("other"))||"₹0"}</dd><dt><b>Total</b></dt><dd><b>${rupee(sum("total"))||"₹0"}</b> · ${paidM.length} file${paidM.length===1?"":"s"}</dd></dl></div>`:""}`;
 $$("#dashBox td.cnt button").forEach(b=>b.onclick=()=>{if(b.dataset.s==="draft"){go("drafts");return}LIST.status=b.dataset.s;LIST.type=b.dataset.t;LIST.q="";LIST.sel=null;go("mydocs")});
 $$("#dashBox tr.pick").forEach(tr=>tr.onclick=()=>{if(tr.dataset.st==="draft")return openDoc(tr.dataset.id);LIST.status="";LIST.type="";LIST.q="";LIST.sel=tr.dataset.id;go("mydocs")})}

/* ---------- Users (advocate only): Registration Desk User IDs via Edge Function staff-logins ---------- */
let USERS=[];
function genPw(){const a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789",r=new Uint32Array(10);crypto.getRandomValues(r);return [...r].map(x=>a[x%a.length]).join("")}
async function callStaff(body){const res=await sb.functions.invoke("staff-logins",{body});if(res.error){let m=res.error.message;try{const c=await res.error.context.json();if(c&&c.error)m=c.error}catch(e){}throw new Error(m)}if(res.data&&res.data.error)throw new Error(res.data.error);return res.data}
function credBox(id,pw,what){return `<div class="errbox" style="border-color:var(--accent);color:var(--ink);background:var(--accent-soft)">${what}<br>User ID: <b class="mono">${esc(id)}</b> &nbsp; Password: <b class="mono">${esc(pw)}</b><br><span class="hint">Give these to the staff member now. The password is not shown again.</span> <button type="button" class="btn sm" data-cp="User ID: ${esc(id)}  Password: ${esc(pw)}">Copy</button></div>`}
function wireCopy(root){root.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copyText(b.dataset.cp))}
function renderUsers(st){crumb("<b>Users</b> · Registration Desk User IDs");
 st.innerHTML=`<div class="card"><h1>Registration Desk User IDs</h1><p class="sub">These User IDs open <b>only the Registration Desk</b>. Staff sign in on the Login Portal (Internal) with the User ID. Tick <b>Practice system</b> for anyone who should also use the Practice system.</p>
  <h2>New User ID</h2><form id="uNew" autocomplete="off"><div class="grid">
   <div class="f" data-req="1" data-lab="Staff name"><label for="u_name">Staff name <span class="req">*</span></label><input type="text" id="u_name" maxlength="80"></div>
   <div class="f" data-req="1" data-lab="User ID"><label for="u_id">User ID <span class="req">*</span></label><input type="text" id="u_id" maxlength="30" placeholder="e.g. ishwarya" autocapitalize="none" spellcheck="false"><span class="note">Small letters, numbers, dot, dash or underscore</span></div>
   <div class="f"><label for="u_des">Designation</label><input type="text" id="u_des" maxlength="60"></div>
   <div class="f"><label for="u_ph">Mobile</label><input type="text" id="u_ph" maxlength="15" inputmode="tel"></div>
   <div class="f" data-req="1" data-lab="Password"><label for="u_pw">Password <span class="req">*</span></label><div class="row" style="flex-wrap:nowrap"><input type="text" id="u_pw" maxlength="64" autocomplete="new-password"><button type="button" class="btn sm sec" id="u_gen">Generate</button></div><span class="note">At least 8 characters</span></div>
  </div><div class="row" style="margin-top:14px"><button type="submit" class="btn">Create User ID</button></div></form><div id="uNewMsg" role="status"></div></div>
  <div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">User IDs</h2><button type="button" class="btn sm sec" id="uReload">Refresh</button></div>
  <div class="tblwrap"><table><thead><tr><th>Name</th><th>User ID</th><th>Designation</th><th>Status</th><th>Access</th><th>Last sign-in</th><th>Actions</th></tr></thead><tbody id="uRows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody></table></div><div id="uMsg" role="status"></div></div>`;
 $("#u_gen").onclick=()=>$("#u_pw").value=genPw();
 $("#u_id").oninput=e=>{const v=e.target.value.toLowerCase().replace(/\s+/g,"");if(v!==e.target.value)e.target.value=v};
 $("#uReload").onclick=loadUsers;
 $("#uNew").onsubmit=async ev=>{ev.preventDefault();const f=ev.target,msg=$("#uNewMsg"),er=requiredCheck(f);if($("#u_pw").value&&$("#u_pw").value.length<8)er.push("Password must be at least 8 characters");if(er.length)return showErr("#uNewMsg",er);
  const body={action:"create",name:$("#u_name").value.trim(),login_id:$("#u_id").value.trim().toLowerCase(),designation:$("#u_des").value.trim(),phone:$("#u_ph").value.trim(),password:$("#u_pw").value};
  const btn=f.querySelector("[type=submit]");btn.disabled=true;msg.innerHTML='<p class="hint">Creating…</p>';
  try{await callStaff(body);msg.innerHTML=credBox(body.login_id,body.password,"User ID created for "+esc(body.name)+".");wireCopy(msg);f.reset();loadUsers()}catch(x){showErr("#uNewMsg",[x.message])}btn.disabled=false};
 loadUsers()}
async function loadUsers(){const tb=$("#uRows");if(!tb)return;tb.innerHTML='<tr><td colspan="7" class="empty">Loading…</td></tr>';
 try{USERS=(await callStaff({action:"list"})).rows||[];drawUsers()}catch(x){tb.innerHTML=`<tr><td colspan="7" class="empty">Could not load: ${esc(x.message)}</td></tr>`}}
function drawUsers(){const tb=$("#uRows");
 if(!USERS.length){tb.innerHTML='<tr><td colspan="7" class="empty">No User IDs yet. Create one above.</td></tr>';return}
 tb.innerHTML=USERS.map((u,i)=>`<tr><td>${esc(u.name||"–")}${u.phone?`<br><span class="hint">${esc(u.phone)}</span>`:""}</td><td class="mono">${esc(u.login_id)}</td><td>${esc(u.designation||"")}</td><td><span class="st ${u.active?"registered":"query"}">${u.active?"Active":"Switched off"}</span></td>
  <td><span class="hint">Registration Desk</span><br><label class="chk"><input type="checkbox" data-px="${i}"${u.practice?" checked":""}> Practice system</label></td><td>${u.last_sign_in?fmtDT(u.last_sign_in):"Never"}</td>
  <td><div class="row" style="flex-wrap:nowrap"><button type="button" class="btn sm sec" data-rs="${i}">Reset password</button>${u.active?`<button type="button" class="btn sm danger" data-off="${i}">Switch off</button>`:`<button type="button" class="btn sm sec" data-on="${i}">Switch on</button>`}</div><div id="rp${i}"></div></td></tr>`).join("");
 tb.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{const i=+b.dataset.rs,u=USERS[i],box=$("#rp"+i);
  box.innerHTML=`<div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" value="${genPw()}" maxlength="64" aria-label="New password for ${esc(u.login_id)}" style="max-width:170px"><button type="button" class="btn sm sec" data-g>Generate</button><button type="button" class="btn sm" data-set>Set password</button></div>`;
  const inp=box.querySelector("input");box.querySelector("[data-g]").onclick=()=>inp.value=genPw();
  box.querySelector("[data-set]").onclick=async ev=>{const pw=inp.value.trim();if(pw.length<8){toast("Password must be at least 8 characters");return}ev.target.disabled=true;
   try{await callStaff({action:"reset",user_id:u.user_id,password:pw});box.innerHTML=credBox(u.login_id,pw,"Password reset for "+esc(u.name||u.login_id)+".");wireCopy(box)}catch(x){ev.target.disabled=false;toast(x.message)}}});
 tb.querySelectorAll("[data-px]").forEach(c=>c.onchange=async()=>{const u=USERS[+c.dataset.px],on=c.checked;c.disabled=true;
  try{await callStaff({action:"practice",user_id:u.user_id,on});u.practice=on;toast((u.name||u.login_id)+(on?" can now also use the Practice system":" – Registration Desk only"))}catch(x){c.checked=!on;toast(x.message)}c.disabled=false});
 tb.querySelectorAll("[data-off],[data-on]").forEach(b=>b.onclick=async()=>{const off=b.hasAttribute("data-off"),u=USERS[+(b.dataset.off||b.dataset.on)];
  if(off&&b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirm switch off";setTimeout(()=>{b.dataset.armed="";b.textContent="Switch off"},4000);return}
  b.disabled=true;try{await callStaff({action:off?"deactivate":"reactivate",user_id:u.user_id});toast((u.name||u.login_id)+(off?" can no longer sign in":" can sign in again"));loadUsers()}catch(x){b.disabled=false;toast(x.message)}})}

/* ---------- start ---------- */
async function boot(){const st=$("#stage");
 if(!window.supabase){st.innerHTML=`<div class="card"><h1>Could not load</h1><p class="sub">The sign-in library did not load. Check the internet and reload the page.</p></div>`;return}
 sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true}});
 const {data}=await sb.auth.getSession();const ses=data&&data.session;
 if(!ses){location.replace("/login/?next="+encodeURIComponent("/registration/"));return}
 ME.id=ses.user.id;ME.email=ses.user.email||"";
 const [o,s2]=await Promise.all([sb.rpc("reg_is_owner"),sb.rpc("reg_is_staff")]);ME.owner=!!o.data||ME.email.toLowerCase()==="vlegal2025@gmail.com";
 $("#whoami").textContent=(ME.owner?"Advocate":"Staff")+" · "+(ME.email.endsWith("@staff.vlegalservices.in")?ME.email.split("@")[0]:ME.email);if(ME.owner)$("#navUsers").hidden=false;
 if(!s2.data){st.innerHTML=`<div class="card"><h1>Not a staff login</h1><p class="sub">${esc(ME.email)} does not have a Registration Desk User ID, or it has been switched off. Ask the advocate (Admin → Users).</p></div>`;return}
 try{const d=await fetch("screens.json").then(r=>r.json());SCR=d;OPTS=d.opts}catch(e){st.innerHTML=`<div class="card"><h1>Could not load the screen definitions</h1><p class="sub">Reload the page.</p></div>`;return}
 go("dash")}

boot();
</script>
