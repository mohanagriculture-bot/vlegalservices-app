  @media(max-width:900px){.grid-nav{grid-template-columns:repeat(2,1fr);}}
  .navcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;transition:.15s;position:relative;overflow:hidden;}

  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .section-title h2{font-size:18px;}
  .section-title .sub{color:var(--muted);font-size:12.5px;}

  .summary-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;}
  @media(max-width:900px){.summary-row{grid-template-columns:repeat(2,1fr);}}

  .stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#B9C4D6;}

  .stat.brass{background:var(--brass);}
  .stat.brass .lbl{color:#F3E3C4;}

  /* ===== Buttons ===== */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:9px 15px;border-radius:7px;font-size:13px;font-weight:600;}
  .btn:hover{background:var(--navy2);}
  .btn.outline{background:transparent;color:var(--navy);}
  .btn.outline:hover{background:#EFEBE0;}
  .btn.brass{background:var(--brass);border-color:var(--brass);}
  .btn.brass:hover{background:var(--brass-light);}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:6px;}
  .btn.danger{background:var(--danger);border-color:var(--danger);}
  .btn.ghost{background:transparent;border:none;color:var(--muted);padding:4px 8px;}
  .btn.ghost:hover{color:var(--ink);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}

  /* ===== Forms ===== */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px;letter-spacing:.01em;}
  .field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#FCFBF8;color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brass-light);outline-offset:1px;border-color:var(--brass);}

  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

  .newcode-panel{background:#FBF9F3;border:1px dashed var(--brass);border-radius:8px;padding:14px;margin-top:8px;}

  .tbl-wrap{overflow-x:auto;}
  .num{text-align:right;font-family:'JetBrains Mono',monospace;}
  .empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .badge.pending{background:var(--pending-bg);color:var(--pending);}
  .badge.partial{background:var(--partial-bg);color:var(--partial);}
  .badge.awaiting{background:#FDE7DA;color:#C2410C;}
  .badge.closed{background:var(--success-bg);color:var(--success);}
  .badge.cancelled{background:var(--danger-bg);color:var(--danger);}

  .badge.proforma{background:#EEE9F5;color:#5B3E96;}

  .item-table th,.item-table td{padding:7px 8px;}
  .item-table input,.item-table select{padding:6px 7px;font-size:13px;}
  .item-table td.amtcell{font-family:'JetBrains Mono',monospace;text-align:right;font-weight:600;}

  .totals-box{margin-left:auto;width:280px;margin-top:10px;}
  .totals-box .tline{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;}
  .totals-box .tline.grand{border-top:2px solid var(--navy);margin-top:5px;padding-top:9px;font-weight:700;font-size:15.5px;color:var(--navy);}

  .code-chip{display:inline-block;font-family:'JetBrains Mono',monospace;background:var(--navy);color:#F3E3C4;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:600;letter-spacing:.02em;}

  .servicecard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .servicecard:hover{border-color:var(--brass);}
  .servicecard .left b{font-size:14px;}
  .servicecard .left .client{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .servicecard .right{display:flex;gap:22px;text-align:right;}
  .servicecard .right .mini{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .servicecard .right .miniv{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;}

  .master-list{list-style:none;margin:0;padding:0;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
  .tab.active{color:var(--navy);border-color:var(--brass);}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .filters .field{margin-bottom:0;min-width:150px;}

  .no-print{}
  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    #app{max-width:none;padding:0;}
  }
  /* ---- Trendy letterhead invoice (print view) ---- */
  :root{ --pv-red:#E30B03; --pv-red-dark:#8C0A02; }
  .pv-sheet{max-width:820px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(140,10,2,.14);}

  .pv-logo-badge{width:64px;height:64px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 4px 12px rgba(0,0,0,.18);flex-shrink:0;}

  .pv-firm-name{font-family:'Lora',serif;font-weight:800;font-size:23px;letter-spacing:.01em;}

  .pv-docmeta{text-align:right;font-size:12px;color:var(--muted);line-height:1.7;}
  .pv-docmeta b{color:var(--ink);font-family:'JetBrains Mono',monospace;}
  .pv-party-card{background:#FAF9F6;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:26px;}
  .pv-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--pv-red);font-weight:700;margin-bottom:8px;}
  .pv-pname{font-family:'Lora',serif;font-weight:700;font-size:14.5px;margin-bottom:6px;}
  .pv-party-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;}
  .pv-line{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:7px;}
  .pv-line b{color:var(--ink);font-weight:600;}
  .pv-table{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:6px;}
  .pv-table thead th{background:var(--ink);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:11px 12px;text-align:left;}
  .pv-table thead th:first-child{border-radius:8px 0 0 0;}
  .pv-table thead th:last-child{border-radius:0 8px 0 0;}
  .pv-table tbody td{padding:12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top;}
  .pv-table tbody tr:nth-child(even){background:#FCFAF7;}
  .pv-svc-name{font-weight:600;}
  .pv-svc-note{color:var(--muted);font-size:11px;margin-top:2px;}
  .pv-gsttag{display:inline-block;font-size:10px;background:#FFEDEA;color:var(--pv-red-dark);padding:2px 7px;border-radius:10px;font-weight:700;margin-top:3px;}
  .pv-bottom-row{display:flex;justify-content:space-between;align-items:flex-start;margin-top:18px;gap:20px;}
  .pv-stamp{border:1.5px dashed var(--pv-red);border-radius:10px;padding:16px 20px;font-size:11.5px;color:var(--pv-red-dark);text-align:center;width:200px;font-weight:600;}
  .pv-stamp .pv-sig{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:500;font-size:10.5px;color:var(--muted);line-height:1.5;}
  .pv-totals{width:270px;background:#FAF9F6;border-radius:12px;padding:16px 20px;margin-left:auto;}
  .pv-tline{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--muted);}
  .pv-tline b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:600;}
  .pv-grand{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;font-weight:800;font-size:17px;color:var(--pv-red-dark);font-family:'Lora',serif;}
  .pv-footer{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);}

  @media print{ .pv-sheet{box-shadow:none;} }

  .empty-hero{text-align:center;padding:50px 20px;color:var(--muted);}

  /* ---- Document preview panel ---- */
  .doc-preview-overlay{position:fixed;inset:0;background:rgba(20,25,35,.45);z-index:999;}
  .doc-preview-panel{position:fixed;top:0;right:0;width:460px;max-width:92vw;height:100vh;background:#fff;z-index:1000;display:flex;flex-direction:column;box-shadow:-10px 0 34px rgba(0,0,0,.18);}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

  .login-msg{font-size:12.5px;padding:9px 12px;border-radius:6px;margin-bottom:14px;}
  .login-msg.error{background:var(--danger-bg);color:var(--danger);}

  .user-chip{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);}
  .preview-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--navy);color:#F3E3C4;padding:10px 16px;border-radius:8px;font-size:12.5px;margin-bottom:18px;}
  .user-chip .btn{padding:6px 12px;font-size:12px;}
  .empty-hero .big{font-family:'Lora',serif;font-size:17px;color:var(--navy);margin-bottom:6px;}

  select[multiple]{height:auto;}
  .helpline{color:var(--muted);font-size:12.5px;margin-bottom:16px;}

  /* ===== Mobile responsiveness ===== */
  @media(max-width:640px){
    #app{padding:14px 12px 50px;}

    .brand-text .t1{font-size:16px;}
    .grid-nav{grid-template-columns:1fr;}
    .summary-row{grid-template-columns:1fr 1fr;gap:8px;}
    .panel{padding:14px;}
    .section-title{flex-direction:column;align-items:flex-start;gap:4px;}
    .filters{flex-direction:column;align-items:stretch;}
    .filters .field{min-width:0;width:100%;}
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .tab{white-space:nowrap;flex-shrink:0;}
    .btnrow .btn{flex:1 1 auto;text-align:center;justify-content:center;}

    .doc-modal{top:2vh;max-height:96vh;}
    .doc-modal-body{padding:14px 14px 20px;}
    .doc-preview-panel{width:100vw;max-width:100vw;}
  }
  @media(max-width:420px){
    .summary-row{grid-template-columns:1fr;}
  }

function hasPerm(groupKey, permKey){
  const effectiveStaffId = loggedInStaffId || previewStaffId;
  if(!effectiveStaffId) return true; // the account owner always sees everything
  const st = state.staff.find(s=>s.id===effectiveStaffId);
  if(!st) return true;
  const perms = st.permissions || {};
  const v = perms[groupKey+'.'+permKey];
  return v!==false; // unset defaults to visible
}

async function doLoginSubmit(mode){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email || !password){ loginMessage={type:'error', text:'Please enter both email and password.'}; render(); return; }
  try{
    if(mode==='signup'){
      const data = await doSignUp(email, password);
      if(data.session){
        currentUser = data.session.user;
        await loadAllData();
        render();
      } else {
        loginMessage = {type:'ok', text:'Account created. Check your email to confirm, then sign in.'};
        loginMode = 'signin';
        render();
      }
    } else {
      const data = await doSignIn(email, password);
      currentUser = data.session.user;
      loginMessage = null;
      await loadAllData();
      render();
    }
  } catch(err){
    loginMessage = {type:'error', text: err.message || 'Something went wrong.'};
    render();
  }
}
async function doPasswordResetRequest(){
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){ loginMessage={type:'error', text:'Please enter your email address first.'}; render(); return; }
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    if(error) throw error;
    loginMessage = {type:'ok', text:`If an account exists for ${email}, a password reset link has been sent. Check your email (and spam folder).`};
    loginMode = 'signin';
    render();
  } catch(err){
    loginMessage = {type:'error', text: err.message || 'Could not send reset email.'};
    render();
  }
}

let needsPasswordSetup = false;
async function initApp(){
  const hash = window.location.hash;
  if(hash.includes('type=invite') || hash.includes('type=recovery')){
    needsPasswordSetup = true;
  }
  const { data:{ session } } = await sb.auth.getSession();
  currentUser = session ? session.user : null;
  if(!currentUser && !needsPasswordSetup){ location.replace('/login/'); return; }
  if(currentUser){
    try {
      const ca = await sb.from('client_accounts').select('id').eq('auth_user_id', currentUser.id).maybeSingle();
      if(ca.data){ location.replace('/client/' + (needsPasswordSetup ? '?setpw=1' : '')); return; }
    } catch(e){}
  }
  sb.auth.onAuthStateChange((event, session)=>{
    const wasLoggedIn = !!currentUser;
    currentUser = session ? session.user : null;
    if(!session && (event==='SIGNED_OUT' || !needsPasswordSetup)){ location.replace('/login/'); return; }
    if(session && !wasLoggedIn && event==='SIGNED_IN' && !needsPasswordSetup){ logActivity('login','auth', currentUser.email||''); }
  });
  if(currentUser && !needsPasswordSetup){
    await loadAllData();
    await resolveStaffSession();
    await ensureApprovalDataLoaded();
  }
  render();
}

  const res = await fetch(SUPABASE_URL + '/functions/v1/manage-staff-access', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },

/* ---------- utils ---------- */
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ n = Number(n)||0; return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function backBar(parentView, parentLabel){
  return `<div class="btnrow no-print" style="margin-bottom:16px;">
    <button class="btn outline sm" data-action="nav" data-view="${parentView}">&larr; ${esc(parentLabel)}</button>
    ${parentView!=='dashboard' ? `<button class="btn ghost sm" data-action="nav" data-view="dashboard">🏠 Home</button>` : ''}

}

function genServiceCode(){
  let max=0;
  state.serviceCodes.forEach(s=>{ const m=/^SC-(\d+)$/.exec(s.code); if(m) max=Math.max(max,parseInt(m[1])); });
  return 'SC-'+String(max+1).padStart(4,'0');
}
function genDocNo(docType){
  const prefix = docType==='proforma' ? 'PI' : 'INV';
  let max=0;
  state.invoices.filter(i=>i.docType===docType).forEach(i=>{
    const m=new RegExp('^'+prefix+'-(\\d+)$').exec(i.docNo); if(m) max=Math.max(max,parseInt(m[1]));
  });
  return prefix+'-'+String(max+1).padStart(4,'0');
}

function invoiceStatus(inv){
  if(inv.closed) return 'Closed';
  if(inv.paidAmount<=0) return 'Pending';
  if(inv.paidAmount < inv.total) return 'Partial';
  return 'Paid'; // fully paid but not yet closed — still shows in Pending Invoices
}
function badgeClass(status){
  if(status==='Closed') return 'closed';
  if(status==='Paid') return 'awaiting';
  if(status==='Partial') return 'partial';
  return 'pending';
}

function serviceCodeSummary(code){
  const invs = state.invoices.filter(i=>i.serviceCode===code && i.docType==='invoice');
  const exps = state.expenses.filter(e=>e.serviceCode===code);
  const recs = state.receipts.filter(r=>r.serviceCode===code);
  const totalInvoiced = invs.reduce((s,i)=>s+i.total,0);
  const totalExpenses = exps.reduce((s,e)=>s+Number(e.amount||0),0);
  const totalReceived = recs.reduce((s,r)=>s+Number(r.amount||0),0);
  const balance = totalInvoiced - totalReceived;
  const profit = totalInvoiced - totalExpenses;
  return {totalInvoiced, totalExpenses, totalReceived, balance, profit, invoiceCount:invs.length, expenseCount:exps.length, receiptCount:recs.length};
}

function renderDashboard(){
  const clientCount = state.clients.length;
  const invs = state.invoices.filter(i=>i.docType==='invoice');
  const pendingCount = invs.filter(i=>!i.closed).length;
  const svcPendingCount = state.serviceCodes.filter(c=>(c.status||'Pending')==='Pending').length;

  const allTiles = [
    { view:'clients', visible:hasPerm('clients','view'), title:'Clients', desc:`${clientCount} client${clientCount===1?'':'s'} on record — registration, KYC documents, and contact details` },
    { view:'services', visible:hasPerm('services','view'), title:'Services', desc:`${state.serviceCodes.length} service${state.serviceCodes.length===1?'':'s'} registered${svcPendingCount?` — ${svcPendingCount} pending`:''}` },
    { view:'accounts', visible:hasPerm('accounts','view'), title:'Accounts', desc:`Invoices, expenses, receipts, P&amp;L, pending invoices, reports${pendingCount?` — ${pendingCount} invoice${pendingCount===1?'':'s'} pending`:''}` },

    { view:'staff-list', visible:!previewStaffId && !loggedInStaffId, title:'HRMS', desc:`${state.staff.length} staff member${state.staff.length===1?'':'s'} — master data &amp; page permissions` },

  ];
  const tiles = allTiles.filter(t=>t.visible);

  const clientOptions = state.clients.slice().sort((a,b)=>a.name.localeCompare(b.name))

function clientAggregateSummary(clientId){
  const codes = clientServiceCodes(clientId);
  let totalInvoiced=0, totalExpenses=0, totalReceived=0;
  codes.forEach(c=>{
    const s = serviceCodeSummary(c.code);
    totalInvoiced += s.totalInvoiced; totalExpenses += s.totalExpenses; totalReceived += s.totalReceived;
  });
  return { codeCount:codes.length, totalInvoiced, totalExpenses, totalReceived, balance: totalInvoiced-totalReceived, profit: totalInvoiced-totalExpenses };
}

async function generateDayBookReport(branchFilter, fromDate, toDate){
  let q = sb.from('branch_day_books').select('*').gte('date', fromDate).lte('date', toDate);
  if(branchFilter) q = q.eq('branch', branchFilter);
  const { data: dayBooksData, error } = await q.order('date');
  if(error){ alert('Could not generate report: '+error.message); return; }

  const dayBookIds = (dayBooksData||[]).map(d=>d.id);
  let txns = [], exps = [];
  if(dayBookIds.length){
    const [txnRes, expRes] = await Promise.all([
      sb.from('counter_transactions').select('*').in('day_book_id', dayBookIds),
      sb.from('branch_expenses').select('*').in('day_book_id', dayBookIds)
    ]);
    txns = (txnRes.data||[]).map(counterTxnFromDb);
    exps = (expRes.data||[]).map(branchExpenseFromDb);
  }

  const rows = (dayBooksData||[]).map(raw=>{
    const db = dayBookFromDb(raw);
    const dTxns = txns.filter(t=>t.dayBookId===db.id);
    const dExps = exps.filter(e=>e.dayBookId===db.id);
    const inwardCash = dTxns.filter(t=>t.paymentMode==='Cash').reduce((s,t)=>s+t.amount,0);
    const inwardGpay = dTxns.filter(t=>t.paymentMode==='GPay').reduce((s,t)=>s+t.amount,0);
    const cashExp = dExps.filter(e=>e.paymentMode==='Cash').reduce((s,e)=>s+e.amount,0);
    const acctExp = dExps.filter(e=>e.paymentMode==='Account').reduce((s,e)=>s+e.amount,0);
    const totalExpenses = cashExp+acctExp, totalInward = inwardCash+inwardGpay;
    return {
      ...db, inwardCash, inwardGpay, totalExpenses, profit: totalInward-totalExpenses,
      closingCash: db.status==='Closed' ? (db.eodClosingCash!=null?db.eodClosingCash:db.openingCash+inwardCash-cashExp) : (db.openingCash+inwardCash-cashExp),
      closingAccount: db.status==='Closed' ? (db.eodClosingAccount!=null?db.eodClosingAccount:db.openingAccount+inwardGpay-acctExp) : (db.openingAccount+inwardGpay-acctExp)
    };
  });

  const svcMap = {};
  txns.forEach(t=>{ const k=t.serviceType||'Unspecified'; if(!svcMap[k]) svcMap[k]={count:0,amount:0}; svcMap[k].count++; svcMap[k].amount+=t.amount; });
  const staffMap = {};
  txns.forEach(t=>{ const k=t.doneByName||'Unspecified'; if(!staffMap[k]) staffMap[k]={count:0,amount:0}; staffMap[k].count++; staffMap[k].amount+=t.amount; });

  dbReportData = { rows, svcMap, staffMap, fromDate, toDate, branchFilter };
  render();
}
async function computeDayBookTotals(dayBookId){
  const [txnRes, expRes] = await Promise.all([
    sb.from('counter_transactions').select('payment_mode, amount').eq('day_book_id', dayBookId),
    sb.from('branch_expenses').select('payment_mode, amount').eq('day_book_id', dayBookId)
  ]);
  if(txnRes.error) throw txnRes.error;
  if(expRes.error) throw expRes.error;
  const txns = txnRes.data||[]; const exps = expRes.data||[];
  const inwardCash = txns.filter(t=>t.payment_mode==='Cash').reduce((s,t)=>s+Number(t.amount||0),0);
  const inwardGpay = txns.filter(t=>t.payment_mode==='GPay').reduce((s,t)=>s+Number(t.amount||0),0);
  const cashExpenses = exps.filter(e=>e.payment_mode==='Cash').reduce((s,e)=>s+Number(e.amount||0),0);
  const accountExpenses = exps.filter(e=>e.payment_mode==='Account').reduce((s,e)=>s+Number(e.amount||0),0);
  return {inwardCash, inwardGpay, cashExpenses, accountExpenses};
}
let dbLoadingKey = null; // key currently being prepared, to prevent duplicate concurrent loads
async function ensureDbLoaded(branch, date){
  const key = branch+'|'+date;
  if(dbLoadedForKey===key) return;
  if(dbLoadingKey===key) return; // already in flight — don't fire a second overlapping request
  dbLoadingKey = key;
  dbLoadError = null;
  try{
    const dayBook = state.dayBooks.find(d=>d.branch===branch && d.date===date);
    if(dayBook){
      const [txnRes, expRes] = await Promise.all([
        sb.from('counter_transactions').select('*').eq('day_book_id', dayBook.id).order('created_at'),
        sb.from('branch_expenses').select('*').eq('day_book_id', dayBook.id).order('created_at')
      ]);
      if(txnRes.error) throw txnRes.error;
      if(expRes.error) throw expRes.error;
      dbWorking = { dayBook, transactions: (txnRes.data||[]).map(counterTxnFromDb), expenses: (expRes.data||[]).map(branchExpenseFromDb) };
      dbLoadedForKey = key;
      dbLoadingKey = null;
      render();
      return;
    }
    // No day book yet — prepare a Day Beginning suggestion rather than silently creating one
    const prior = state.dayBooks.filter(d=>d.branch===branch && d.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0];
    let suggestedCash = 0, suggestedAccount = 0;
    if(prior){
      if(prior.status==='Closed'){
        suggestedCash = prior.eodClosingCash||0;
        suggestedAccount = prior.eodClosingAccount||0;
      } else {
        const t = await computeDayBookTotals(prior.id);
        suggestedCash = prior.openingCash + t.inwardCash - t.cashExpenses;
        suggestedAccount = prior.openingAccount + t.inwardGpay - t.accountExpenses;
      }
    }
    dbDayBeginningSuggestion = { branch, date, suggestedCash, suggestedAccount, priorDate: prior?prior.date:null, priorClosed: prior?prior.status==='Closed':false };
    dbLoadingKey = null;
    render();
  } catch(err){
    dbLoadingKey = null;
    dbLoadError = { branch, date, message: (err && err.message) ? err.message : 'Unknown error' };
    render();
  }
}
async function confirmDayBeginning(){
  const s = dbDayBeginningSuggestion;
  if(!s) return;
  const cash = Number(document.getElementById('dbgOpeningCash').value)||0;
  const account = Number(document.getElementById('dbgOpeningAccount').value)||0;
  const { data, error } = await sb.from('branch_day_books').insert({branch:s.branch, date:s.date, opening_cash:cash, opening_account:account, status:'Open'}).select().single();
  if(error){ alert('Could not start the day: '+error.message); return; }
  const dayBook = dayBookFromDb(data);
  state.dayBooks.push(dayBook);
  dbDayBeginningSuggestion = null;
  dbWorking = { dayBook, transactions: [], expenses: [] };
  dbLoadedForKey = s.branch+'|'+s.date;
  render();
}
function dbComputeTotals(){
  const txns = dbWorking.transactions, exps = dbWorking.expenses;
  const inwardCash = txns.filter(t=>t.paymentMode==='Cash').reduce((s,t)=>s+t.amount,0);
  const inwardGpay = txns.filter(t=>t.paymentMode==='GPay').reduce((s,t)=>s+t.amount,0);
  const cashExpenses = exps.filter(e=>e.paymentMode==='Cash').reduce((s,e)=>s+e.amount,0);
  const accountExpenses = exps.filter(e=>e.paymentMode==='Account').reduce((s,e)=>s+e.amount,0);
  const totalInward = inwardCash+inwardGpay, totalExpenses = cashExpenses+accountExpenses;
  return {
    inwardCash, inwardGpay, cashExpenses, accountExpenses, totalInward, totalExpenses,
    profit: totalInward-totalExpenses,
    closingCash: dbWorking.dayBook.openingCash + inwardCash - cashExpenses,
    closingAccount: dbWorking.dayBook.openingAccount + inwardGpay - accountExpenses
  };
}

/* =========================================================
   MAKER-CHECKER APPROVAL WORKFLOW
========================================================= */
let approvalTasks = [];
let approvalRoutes = [];
let approvalDataLoaded = false;
async function ensureApprovalDataLoaded(){
  if(approvalDataLoaded) return;
  const [tRes, rRes] = await Promise.all([
    sb.from('approval_tasks').select('*').order('created_at', {ascending:false}).limit(500),
    sb.from('approval_routes').select('*')
  ]);
  approvalTasks = tRes.data||[];
  approvalRoutes = rRes.data||[];
  approvalDataLoaded = true;
}
function myStaffRecord(){
  return loggedInStaffId ? state.staff.find(s=>s.id===loggedInStaffId) : null;
}
function approversForMaker(makerStaffId){
  return approvalRoutes.filter(r=>r.maker_staff_id===makerStaffId).map(r=>r.approver_staff_id);
}
function myPendingApprovalCount(){
  const me = myStaffRecord();
  if(isFirmOwner) return approvalTasks.filter(t=>t.status==='pending').length;
  if(!me) return 0;
  return approvalTasks.filter(t=>t.status==='pending' && (t.assigned_approver_ids||[]).includes(me.id)).length;
}
function myPendingSubmissionCount(){
  if(!currentUser) return 0;
  return approvalTasks.filter(t=>t.status==='pending' && t.created_by===currentUser.id).length;
}

/**
 * The single entry point every tracked module's save/delete goes through.
 * If the current user is the Owner, the write happens immediately (unchanged
 * behavior). Otherwise it's queued as a task and nothing touches the live
 * table until an approver acts on it.
 *
 * opts: { taskType, action:'create'|'edit'|'delete', targetTable, targetId,
 *         payload, previousSnapshot, recordLabel, reason }
 * Returns: { bypassed: true, data } if it ran immediately,
 *          { bypassed: false, task } if it was queued.
 */
async function submitOrExecute(opts){
  if(isFirmOwner){
    const data = await directTableWrite(opts.targetTable, opts.action, opts.targetId, opts.payload);
    return { bypassed:true, data };
  }
  const me = myStaffRecord();
  const approverIds = me ? approversForMaker(me.id) : [];
  const row = {
    task_type: opts.taskType, action: opts.action, status:'pending',
    target_table: opts.targetTable, target_id: opts.targetId||null,
    payload: opts.payload||null, previous_snapshot: opts.previousSnapshot||null,
    record_label: opts.recordLabel||'', reason: opts.reason||'', section: opts.section||null,
    created_by: currentUser.id, created_by_name: me?me.name:(currentUser.email||''),
    assigned_approver_ids: approverIds
  };
  const { data, error } = await sb.from('approval_tasks').insert(row).select().single();
  if(error) throw error;
  approvalTasks.unshift(data);
  await logActivity('create','approval_tasks', `Submitted for approval: ${opts.recordLabel||opts.taskType}`);
  return { bypassed:false, task:data };
}
async function directTableWrite(table, action, targetId, payload){
  if(action==='create'){
    const { data, error } = await sb.from(table).insert(payload).select().single();
    if(error) throw error;
    return data;
  }
  if(action==='edit'){
    const { data, error } = await sb.from(table).update(payload).eq('id', targetId).select().single();
    if(error) throw error;
    return data;
  }
  if(action==='delete'){
    const { error } = await sb.from(table).delete().eq('id', targetId);
    if(error) throw error;
    return { id: targetId };
  }
}
async function approveTask(taskId){
  const task = approvalTasks.find(t=>t.id===taskId);
  if(!task) return;
  if(!confirm(`Approve this ${task.action} on ${task.record_label||task.task_type}? It will go live immediately.`)) return;
  try{
    const result = await directTableWrite(task.target_table, task.action, task.target_id, task.payload);
    if(task.task_type==='receipt'){ await applyReceiptEffectsAfterApproval(task, result); }
    const { data, error } = await sb.from('approval_tasks').update({
      status:'approved', reviewed_by: currentUser.id, reviewed_by_name: (myStaffRecord()||{}).name || (isFirmOwner?FIRM.name+' (Owner)':''),
      reviewed_at: new Date().toISOString()
    }).eq('id', taskId).select().single();
    if(error) throw error;
    Object.assign(task, data);
    await logActivity('update','approval_tasks', `Approved: ${task.record_label||task.task_type}`);
    await refreshModuleAfterApproval(task.task_type);
    render();
  }catch(err){
    alert('Could not approve: '+err.message);
  }
}
async function applyReceiptEffectsAfterApproval(task, newRow){
  // Un-apply from whichever invoice this receipt was previously linked to
  // (covers edit and delete — for create there's nothing to unapply).
  if((task.action==='edit' || task.action==='delete') && task.previous_snapshot && task.previous_snapshot.invoice_id){
    const { data: oldInv } = await sb.from('invoices').select('*').eq('id', task.previous_snapshot.invoice_id).single();
    if(oldInv){
      const newPaid = Math.max(0, Number(oldInv.paid_amount||0) - Number(task.previous_snapshot.amount||0));
      await sb.from('invoices').update({ paid_amount:newPaid, closed: newPaid<Number(oldInv.total||0) ? false : oldInv.closed }).eq('id', oldInv.id);
    }
  }
  // Apply to the (possibly new) linked invoice — covers create and edit.
  if((task.action==='create' || task.action==='edit') && newRow && newRow.invoice_id){
    const { data: inv } = await sb.from('invoices').select('*').eq('id', newRow.invoice_id).single();
    if(inv){
      const newPaid = Math.min(Number(inv.total||0), Number(inv.paid_amount||0) + Number(newRow.amount||0));
      await sb.from('invoices').update({ paid_amount:newPaid, closed: newPaid<Number(inv.total||0) ? false : inv.closed }).eq('id', inv.id);
    }
  }
  const { data } = await sb.from('invoices').select('*').order('date',{ascending:false});
  state.invoices = (data||[]).map(invFromDb);
}
async function rejectTask(taskId){
  const task = approvalTasks.find(t=>t.id===taskId);
  if(!task) return;
  const notes = prompt('Reason for rejecting this task (visible to the person who submitted it):');
  if(notes===null) return;
  const { data, error } = await sb.from('approval_tasks').update({
    status:'rejected', review_notes: notes,
    reviewed_by: currentUser.id, reviewed_by_name: (myStaffRecord()||{}).name || (isFirmOwner?FIRM.name+' (Owner)':''),
    reviewed_at: new Date().toISOString()
  }).eq('id', taskId).select().single();
  if(error){ alert('Could not reject: '+error.message); return; }
  Object.assign(task, data);
  await logActivity('update','approval_tasks', `Rejected: ${task.record_label||task.task_type}`);
  render();
}
async function refreshModuleAfterApproval(taskType){
  if(taskType==='client'){ const { data } = await sb.from('clients').select('*').order('name'); state.clients = (data||[]).map(clientFromDb); }
  if(taskType==='service'){ const { data } = await sb.from('service_codes').select('*').order('code'); state.serviceCodes = (data||[]).map(scFromDb); }
  if(taskType==='invoice'){ const { data } = await sb.from('invoices').select('*').order('date',{ascending:false}); state.invoices = (data||[]).map(invFromDb); }
  if(taskType==='expense'){ const { data } = await sb.from('expenses').select('*').order('date',{ascending:false}); state.expenses = (data||[]).map(expFromDb); }
  if(taskType==='receipt'){ const { data } = await sb.from('receipts').select('*').order('date',{ascending:false}); state.receipts = (data||[]).map(recFromDb); }
  if(taskType==='legal_opinion'){ const { data } = await sb.from('legal_opinions').select('*'); state.legalOpinions = (data||[]).map(loFromDb); }
}

function renderApprovalRouting(){
  if(!isFirmOwner){
    return `${backBar('dashboard','Dashboard')}<div class="empty-hero">Only the firm owner can manage approval routing.</div>`;
  }
  if(!approvalDataLoaded){
    ensureApprovalDataLoaded().then(render);
    return `${backBar('staff-list','HRMS')}<div class="empty-hero">Loading…</div>`;
  }
  const makers = state.staff.filter(s=>s.workflowRole==='maker' || s.workflowRole==='both');
  const approvers = state.staff.filter(s=>s.workflowRole==='approver' || s.workflowRole==='both');
  const rows = makers.map(m=>{
    const routes = approvalRoutes.filter(r=>r.maker_staff_id===m.id);
    const routedApprovers = routes.map(r=>{
      const ap = state.staff.find(s=>s.id===r.approver_staff_id);
      return `<span class="badge closed" style="margin:0 6px 6px 0;display:inline-flex;align-items:center;gap:6px;">${esc(ap?ap.name:'—')} <span style="cursor:pointer;font-weight:700;" data-action="remove-approval-route" data-id="${r.id}">✕</span></span>`;
    }).join('');
    const availableApprovers = approvers.filter(a=>!routes.some(r=>r.approver_staff_id===a.id));
    return `<tr>
      <td>${esc(m.name)}</td>
      <td>${routedApprovers || '<span class="hint">No approver assigned yet</span>'}</td>
      <td>
        ${availableApprovers.length ? `<div class="btnrow">
          <select id="routeSelect_${m.id}" style="width:auto;padding:6px 8px;">
            ${availableApprovers.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}
          </select>
          <button class="btn ghost sm" data-action="add-approval-route" data-maker="${m.id}">+ Add</button>
        </div>` : `<span class="hint">${approvers.length===0?'No staff marked as Approver yet':'All approvers already assigned'}</span>`}
      </td>
    </tr>`;
  }).join('');
  return `
  ${backBar('staff-list','HRMS')}
  <div class="section-title"><h2>Approval Routing</h2></div>
  <p class="helpline">Decide which Approver(s) review each Maker's submissions. A task is visible to every approver listed for that maker, and closes as soon as any one of them acts on it.</p>
  <div class="panel">
    ${makers.length ? `<div class="tbl-wrap"><table class="item-table"><thead><tr><th>Maker</th><th>Routed To</th><th>Add Approver</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty">No staff are marked as Maker or Both yet. Set a staff member's Workflow Role in HRMS first.</div>`}
  </div>`;
}
async function addApprovalRoute(makerId){
  const sel = document.getElementById('routeSelect_'+makerId);
  if(!sel || !sel.value) return;
  const { data, error } = await sb.from('approval_routes').insert({ maker_staff_id: makerId, approver_staff_id: sel.value }).select().single();
  if(error){ alert('Could not add route: '+error.message); return; }
  approvalRoutes.push(data);
  render();
}
async function removeApprovalRoute(routeId){
  if(!confirm('Remove this approver from this maker\u2019s routing?')) return;
  const { error } = await sb.from('approval_routes').delete().eq('id', routeId);
  if(error){ alert('Could not remove: '+error.message); return; }
  approvalRoutes = approvalRoutes.filter(r=>r.id!==routeId);
  render();
}

function renderDocPreviewPanel(){
  const d = previewDoc;
  const ext = (d.fileName.split('.').pop()||'').toLowerCase();
  const isImage = ['jpg','jpeg','png','gif','webp','bmp'].includes(ext);
  const isPdf = ext==='pdf';
  let content;
  if(isImage){
    content = `<img src="${d.url}" alt="${esc(d.fileName)}">`;
  } else if(isPdf){
    content = `<iframe src="${d.url}" title="${esc(d.fileName)}"></iframe>`;
  } else {
    content = `<div class="empty-hero">Preview isn't available for this file type.<br><br><a class="btn brass sm" href="${d.url}" target="_blank" rel="noopener">Open in new tab</a></div>`;
  }
  return `
  <div class="doc-preview-overlay" data-action="close-preview"></div>
  <div class="doc-preview-panel">
    <div class="doc-preview-header">
      <div>
        <div class="fname">${esc(d.fileName)}</div>
        <div class="ftype">${esc(d.docType||'')}</div>
      </div>
      <button class="btn ghost sm" data-action="close-preview">✕ Close</button>
    </div>
    <div class="doc-preview-body">${content}</div>
  </div>`;
}

function renderKycSection(clientId){
  const docs = clientDocsCache[clientId];
  const docTypeOptions = KYC_DOC_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('');
  let listHtml;
  if(docs===undefined){
    loadClientDocuments(clientId);
    listHtml = `<div class="empty">Loading documents…</div>`;
  } else if(docs.length===0){
    listHtml = `<div class="empty">No documents uploaded yet.</div>`;
  } else {
    const rows = docs.map(d=>`<tr>
      <td>${esc(d.fileName)}</td>
      <td>${esc(d.docType||'Other')}</td>
      <td class="num">${d.fileSize ? (d.fileSize/1024).toFixed(0)+' KB' : '—'}</td>
      <td>${fmtDate(d.uploadedAt)}</td>
      <td><div class="btnrow">
        <button class="btn ghost sm" data-action="view-kyc-doc" data-path="${esc(d.storagePath)}" data-name="${esc(d.fileName)}" data-doctype="${esc(d.docType||'')}">View</button>
        <button class="btn ghost sm" data-action="delete-kyc-doc" data-id="${d.id}" data-client="${clientId}" data-path="${esc(d.storagePath)}">Delete</button>
      </div></td>
    </tr>`).join('');
    listHtml = `<div class="tbl-wrap"><table><thead><tr><th>File</th><th>Type</th><th>Size</th><th>Uploaded</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return `
  <div class="section-title"><h2 style="font-size:15px;">KYC Documents</h2></div>
  <div class="panel">
    <p class="helpline" style="margin-bottom:12px;">For office records only — PAN card, Aadhaar copy, address proof, property papers, etc. Stored privately, visible only to you.</p>
    <div class="btnrow" style="margin-bottom:14px;">
      <select id="kycDocType" style="width:auto;padding:9px 10px;border:1px solid var(--line);border-radius:6px;">${docTypeOptions}</select>
      <button class="btn outline sm" type="button" data-action="trigger-kyc-upload">+ Upload Document</button>
      <input type="file" id="kycFileInput" multiple style="display:none;">
    </div>
    ${listHtml}
  </div>`;
}

function renderItemsTable(){
  const body = document.getElementById('itemsBody');
  if(!body) return;
  body.innerHTML = formItems.map((it,i)=>itemRowHTML(it,i)).join('');
}
function itemRowHTML(it,i){
  const options = state.serviceTypes.map(s=>`<option value="${esc(s)}" ${it.description===s?'selected':''}>${esc(s)}</option>`).join('');
  const rate = Number(it.rate)||0;
  const gstRate = Number(it.gstRate)||0;
  const amt = rate + (rate*gstRate/100);
  const gstOptions = GST_RATES.map(r=>`<option value="${r}" ${gstRate===r?'selected':''}>${r===0?'No GST':r+'%'}</option>`).join('');
  return `<tr data-row="${i}">
    <td><select data-role="item-service" data-row="${i}">
      <option value="">Choose service…</option>${options}<option value="__custom__" ${!state.serviceTypes.includes(it.description)&&it.description?'selected':''}>Custom / Other</option>
    </select></td>
    <td><input data-role="item-notes" data-row="${i}" value="${esc(it.notes||'')}" placeholder="Optional note for this line"></td>
    <td><input type="number" min="0" step="0.01" data-role="item-rate" data-row="${i}" value="${it.rate}"></td>
    <td><select data-role="item-gst" data-row="${i}">${gstOptions}</select></td>
    <td class="amtcell" data-role="item-amt" data-row="${i}">${fmt(amt)}</td>
    <td><button class="btn ghost sm" data-action="remove-item" data-row="${i}">✕</button></td>
  </tr>`;
}

function recalcTotals(){
  const subtotal = formItems.reduce((s,it)=> s + (Number(it.rate)||0), 0);
  const gstAmt = formItems.reduce((s,it)=> s + (Number(it.rate)||0)*(Number(it.gstRate)||0)/100, 0);
  const total = subtotal+gstAmt;
  const gstOn = gstAmt > 0;
  const box = document.getElementById('totalsBox');
  if(box){
    box.innerHTML = `
      <div class="tline"><span>Subtotal</span><span class="mono">${fmt(subtotal)}</span></div>
      ${gstOn ? `<div class="tline"><span>CGST</span><span class="mono">${fmt(gstAmt/2)}</span></div>
      <div class="tline"><span>SGST</span><span class="mono">${fmt(gstAmt/2)}</span></div>` : ''}
      <div class="tline grand"><span>Total</span><span class="mono">${fmt(total)}</span></div>`;
  }
  return {subtotal, gstAmt, total, gstOn};
}

    return `<tr>

      ${opts.showCode?`<td><span class="code-chip">${esc(inv.serviceCode)}</span></td>`:''}

      <td class="num">${fmt(balance)}</td>

      <td>
        <div class="btnrow">

/* =========================================================
   PROFIT & LOSS
========================================================= */
function renderPL(){
  const from = state.params.from || '';
  const to = state.params.to || '';
  const inRange = (d)=> (!from || d>=from) && (!to || d<=to);

  const rows = state.serviceCodes.map(c=>{
    const invs = state.invoices.filter(i=>i.serviceCode===c.code && i.docType==='invoice' && inRange(i.date));
    const exps = state.expenses.filter(e=>e.serviceCode===c.code && inRange(e.date));
    const recs = state.receipts.filter(r=>r.serviceCode===c.code && inRange(r.date));
    const totalInvoiced = invs.reduce((s,i)=>s+i.total,0);
    const totalExpenses = exps.reduce((s,e)=>s+Number(e.amount||0),0);
    const totalReceived = recs.reduce((s,r)=>s+Number(r.amount||0),0);
    return {code:c.code, client:c.clientName, totalInvoiced, totalExpenses, totalReceived, profit:totalInvoiced-totalExpenses, balance:totalInvoiced-totalReceived};
  }).filter(r=>r.totalInvoiced||r.totalExpenses||r.totalReceived);

  const gInvoiced = rows.reduce((s,r)=>s+r.totalInvoiced,0);
  const gExpenses = rows.reduce((s,r)=>s+r.totalExpenses,0);
  const gReceived = rows.reduce((s,r)=>s+r.totalReceived,0);
  const gProfit = gInvoiced-gExpenses;

  const trs = rows.map(r=>`<tr>
    <td><span class="code-chip">${esc(r.code)}</span></td><td>${esc(r.client)}</td>
    <td class="num">${fmt(r.totalInvoiced)}</td><td class="num">${fmt(r.totalExpenses)}</td>
    <td class="num" style="font-weight:700;color:${r.profit>=0?'var(--success)':'var(--danger)'}">${fmt(r.profit)}</td>
    <td class="num">${fmt(r.totalReceived)}</td><td class="num">${fmt(r.balance)}</td>
    <td><button class="btn ghost sm" data-action="open-service" data-code="${esc(r.code)}">View</button></td>
  </tr>`).join('');

  return `
  ${backBar('accounts','Accounts')}
  <div class="section-title"><h2>Profit and Loss Statement</h2><span class="sub">Income booked from Tax Invoices only — Proforma excluded</span></div>
  <div class="filters panel">
    <div class="field"><label>From date</label><input type="date" id="plFrom" value="${from}"></div>
    <div class="field"><label>To date</label><input type="date" id="plTo" value="${to}"></div>
    <button class="btn outline sm" data-action="apply-pl-filter">Apply Filter</button>
    <button class="btn ghost sm" data-action="clear-pl-filter">Clear</button>
  </div>
  <div class="summary-row">
    <div class="stat brass"><div class="lbl">Total Invoiced</div><div class="val">${fmt(gInvoiced)}</div></div>
    <div class="stat"><div class="lbl">Total Expenses</div><div class="val">${fmt(gExpenses)}</div></div>
    <div class="stat"><div class="lbl">Net Profit</div><div class="val">${fmt(gProfit)}</div></div>
    <div class="stat"><div class="lbl">Total Received</div><div class="val">${fmt(gReceived)}</div></div>
    <div class="stat"><div class="lbl">Outstanding</div><div class="val">${fmt(gInvoiced-gReceived)}</div></div>
  </div>
  <div class="panel">${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Client</th><th>Invoiced</th><th>Expenses</th><th>Profit</th><th>Received</th><th>Balance</th><th></th></tr></thead><tbody>${trs}</tbody></table></div>`:'<div class="empty">No financial activity in this range yet.</div>'}</div>`;
}

/* =========================================================
   PENDING INVOICES
========================================================= */
function renderPending(){
  const filter = state.params.status || 'all';
  // Pending Invoices = every invoice not yet explicitly closed — includes No Payment, Partial,
  // and even Fully Paid ones still awaiting closure via the Receipt page or a manual "Close".
  let list = state.invoices.filter(i=>i.docType==='invoice' && !i.closed);
  if(filter==='pending') list = list.filter(i=>invoiceStatus(i)==='Pending');
  if(filter==='partial') list = list.filter(i=>invoiceStatus(i)==='Partial');
  if(filter==='awaiting') list = list.filter(i=>invoiceStatus(i)==='Paid');
  list.sort((a,b)=>a.date.localeCompare(b.date));

  const allOpen = state.invoices.filter(i=>i.docType==='invoice' && !i.closed);
  const totalPending = list.reduce((s,i)=>s+(i.total-i.paidAmount),0);

  return `
  ${backBar('accounts','Accounts')}
  <div class="section-title"><h2>Pending Invoices</h2><span class="sub">Total outstanding: <b>${fmt(totalPending)}</b></span></div>
  <p class="helpline">An invoice stays here until it's explicitly <b>closed</b> — either by confirming "close" when a full payment is recorded on the Receipt page, or manually below.</p>
  <div class="tabs no-print">
    <div class="tab ${filter==='all'?'active':''}" data-action="pending-filter" data-status="all">All (${allOpen.length})</div>
    <div class="tab ${filter==='pending'?'active':''}" data-action="pending-filter" data-status="pending">No Payment (${allOpen.filter(i=>invoiceStatus(i)==='Pending').length})</div>
    <div class="tab ${filter==='partial'?'active':''}" data-action="pending-filter" data-status="partial">Partially Paid (${allOpen.filter(i=>invoiceStatus(i)==='Partial').length})</div>
    <div class="tab ${filter==='awaiting'?'active':''}" data-action="pending-filter" data-status="awaiting">Fully Paid — Awaiting Closure (${allOpen.filter(i=>invoiceStatus(i)==='Paid').length})</div>
  </div>
  <div class="panel">${renderInvoiceTable(list,{showCode:true})}</div>`;
}

/* =========================================================
   REPORTS
========================================================= */
function renderReports(){
  const from = state.params.from || '';
  const to = state.params.to || '';
  const inRange = (d)=> (!from || d>=from) && (!to || d<=to);

  const invs = state.invoices.filter(i=>i.docType==='invoice' && inRange(i.date));
  const exps = state.expenses.filter(e=>inRange(e.date));
  const recs = state.receipts.filter(r=>inRange(r.date));

  const totalInvoiced = invs.reduce((s,i)=>s+i.total,0);
  const totalGST = invs.reduce((s,i)=>s+(i.gstAmount||0),0);
  const totalExpenses = exps.reduce((s,e)=>s+Number(e.amount||0),0);
  const totalReceived = recs.reduce((s,r)=>s+Number(r.amount||0),0);
  const pending = invs.filter(i=>!i.closed).reduce((s,i)=>s+(i.total-i.paidAmount),0);

  // service-type wise breakdown
  const svcMap = {};
  invs.forEach(inv=>{
    inv.items.forEach(it=>{
      const key = it.description || 'Uncategorised';
      if(!svcMap[key]) svcMap[key] = {count:0, amount:0};
      svcMap[key].count += 1;
      svcMap[key].amount += (Number(it.rate)||0);
    });
  });
  const svcRows = Object.entries(svcMap).sort((a,b)=>b[1].amount-a[1].amount)
    .map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.count}</td><td class="num">${fmt(v.amount)}</td></tr>`).join('');

  return `
  ${backBar('accounts','Accounts')}
  <div class="section-title"><h2>Reports</h2></div>
  <div class="filters panel">
    <div class="field"><label>From date</label><input type="date" id="repFrom" value="${from}"></div>
    <div class="field"><label>To date</label><input type="date" id="repTo" value="${to}"></div>
    <button class="btn outline sm" data-action="apply-report-filter">Apply Filter</button>
    <button class="btn ghost sm" data-action="clear-report-filter">Clear</button>
  </div>
  <div class="summary-row">
    <div class="stat brass"><div class="lbl">Total Invoiced</div><div class="val">${fmt(totalInvoiced)}</div></div>
    <div class="stat"><div class="lbl">GST Collected</div><div class="val">${fmt(totalGST)}</div></div>
    <div class="stat"><div class="lbl">Total Received</div><div class="val">${fmt(totalReceived)}</div></div>
    <div class="stat"><div class="lbl">Total Expenses</div><div class="val">${fmt(totalExpenses)}</div></div>
    <div class="stat"><div class="lbl">Pending</div><div class="val">${fmt(pending)}</div></div>
  </div>
  <div class="section-title"><h2 style="font-size:15px;">Revenue by Service Type</h2></div>
  <div class="panel">${svcRows?`<div class="tbl-wrap"><table><thead><tr><th>Service</th><th>Line Items</th><th>Amount</th></tr></thead><tbody>${svcRows}</tbody></table></div>`:'<div class="empty">No invoiced items yet.</div>'}</div>
  <div class="section-title"><h2 style="font-size:15px;">All Invoices in Range</h2></div>
  <div class="panel">${renderInvoiceTable(invs.slice().sort((a,b)=>b.date.localeCompare(a.date)),{showCode:true})}</div>`;
}

function joinWithAnd(list){
  const arr = (list||[]).filter(Boolean);
  if(arr.length===0) return '';

function propertyListText(doc){
  return (doc.propertyDetails||[]).map(p=>{
    let s = `${p.sfType||'S.F.NO.'} ${p.surveyNumber||''} with an extent of ${p.extent||''} ${p.extentUnit||'Acres'}`.trim();
    const loc = propertyLocationSummary(p);
    if(loc && loc!=='—') s += `, of ${loc}`;
    if(p.remark) s += `, ${p.remark}`;
    return s;
  }).join(', ');
}

/* Deed-specific title-tracing templates — matched against the document's
   "Name of the Document" (case-insensitive substring match). Add more here
   as each deed type's wording is confirmed. Falls back to a generic
   Partition-Deed-style narrative for anything not yet mapped. */
const TRACING_TEMPLATES = {
  'sale deed': (doc) => {
    const executants = joinWithAnd(doc.executants);
    const claimants = joinWithAnd(doc.claimants);
    const name = docRowDisplayName(doc);
    const docType = doc.documentType || 'Registered';
    const dateStr = doc.dateOfDocument ? fmtDate(doc.dateOfDocument) : '';
    const docRef = [doc.documentNumber, doc.bookNumber, doc.year].filter(Boolean).join('/');
    const office = [doc.registrarOfficeType, doc.placeOfRegistrarOffice].filter(Boolean).join(', ');
    const props = propertyListText(doc);
    return `The said ${executants||'[executants not filled in]'} had executed a ${docType} ${name} in favour of ${claimants||'[claimants not filled in]'} on ${dateStr} vide registered as document No. ${docRef||'[document number]'} of ${office||'[registrar office]'} in respect of the property in ${props||'[property details not filled in]'}. As per the ${docType} ${name} the ${claimants||'[claimants not filled in]'} become absolute owner of the property in respect of the property in ${props||'[property details not filled in]'}. The ${doc.natureOfDocument||'Original'} of ${name} is produced herewith as document number ##NO##.`;
  }
};
function generateGenericTracing(doc){
  const props = propertyListText(doc);
  const executants = joinWithAnd(doc.executants);
  const docRef = [doc.documentNumber, doc.bookNumber, doc.year].filter(Boolean).join('/');
  const office = [doc.registrarOfficeType, doc.placeOfRegistrarOffice].filter(Boolean).join(' ');
  const name = docRowDisplayName(doc);
  const dateStr = doc.dateOfDocument ? fmtDate(doc.dateOfDocument) : '';
  return `The said property in ${props||'[property details not filled in]'}, was originally belonged to ${executants||'[executants not filled in]'} and by virtue of ${name} dated ${dateStr} Vide document number ${docRef||'[document number]'} of ${office||'[registrar office]'}. The ${doc.natureOfDocument||'Original'} of ${name} is produced herewith as document number ##NO##.`;
}
function generateSuggestedTracing(doc){
  const name = (docRowDisplayName(doc)||'').toLowerCase();
  const key = Object.keys(TRACING_TEMPLATES).find(k => name.includes(k));
  if(key) return TRACING_TEMPLATES[key](doc);
  return generateGenericTracing(doc);
}
function renderTracingDisplayText(text, docNumber){
  return esc(text).replace(/##NO##/g, esc(String(docNumber))).replace(/\n/g,'<br>');
}

/* ---------- Description of Property (rich schedule builder) ---------- */
function scheduleLocalBody(s){
  return [s.municipality&&`${s.municipality} Municipality`, s.corporation&&`${s.corporation} Corporation`, s.townPanchayat&&`${s.townPanchayat} Town Panchayat`, s.villagePanchayat&&`${s.villagePanchayat} Village Panchayat`, s.village&&`${s.village} Village`].filter(Boolean).join(', ');
}
function scheduleBoundaryLine(b){
  const n = b.north.desc?`North by ${b.north.type?b.north.type+' ':''}${b.north.desc}`:'';
  const s = b.south.desc?`South by ${b.south.type?b.south.type+' ':''}${b.south.desc}`:'';
  const e = b.east.desc?`East by ${b.east.type?b.east.type+' ':''}${b.east.desc}`:'';
  const w = b.west.desc?`West by ${b.west.type?b.west.type+' ':''}${b.west.desc}`:'';
  return [n,s,e,w].filter(Boolean).join(', ');
}
function propertyScheduleText(s){
  const parts = [];
  parts.push(`All that piece and parcel of land situated in ${scheduleLocalBody(s)||'[village/local body not filled in]'}${s.taluk?`, ${s.taluk} Taluk`:''}${s.subRegistrationDistrict?`, ${s.subRegistrationDistrict} Sub-Registration District`:''}${s.registrationDistrict?`, ${s.registrationDistrict} Registration District`:''}${s.district?`, ${s.district} District`:''}, comprised in ${s.sfType||'S.F.No'}. ${s.surveyNumber||'[survey number]'}${s.pattaNumber?`, Patta No. ${s.pattaNumber}`:''}, measuring an extent of ${s.extent||'[extent]'} ${s.extentUnit||''}${s.extentEquivalent?` equivalent to ${s.extentEquivalent} ${s.extentEquivalentUnit||''}`:''}${s.subExtent?`, in which an extent of ${s.subExtent} ${s.subExtentUnit||''}${s.subExtentEquivalent?` equivalent to ${s.subExtentEquivalent} ${s.subExtentEquivalentUnit||''}`:''}`:''}${s.kistValue?`, Kist value of Rs.${s.kistValue}${s.kistClassifier?` for ${s.kistClassifier}`:''}`:''}.`);
  if(s.otherDetails) parts.push(s.otherDetails);
  const bLine = scheduleBoundaryLine(s.boundaries);
  if(bLine) parts.push(`The above property is bounded on the ${bLine}.`);
  const rLine = scheduleBoundaryLine(s.revenueBoundaries);
  if(rLine) parts.push(`As per revenue records, the property is bounded on the ${rLine}.`);
  if(s.admeasuringExtent) parts.push(`The property thus admeasures an extent of ${s.admeasuringExtent} ${s.admeasuringUnit||''}${s.admeasuringEquivalent?` equivalent to ${s.admeasuringEquivalent} ${s.admeasuringEquivalentUnit||''}`:''}${s.admeasuringKistValue?`, Kist value of Rs.${s.admeasuringKistValue}`:''}.`);
  if(s.additionalRights) parts.push(`Additional rights: ${s.additionalRights}`);
  return parts.join(' ');
}

function loRowsTableHTML(arrayName, columns, addLabel){
  const rows = loWorking[arrayName];
  const head = columns.map(c=>`<th>${c.label}</th>`).join('') + '<th></th>';
  const body = rows.map((row,i)=>{
    const cells = columns.map(c=>{
      if(c.type==='select'){
        const opts = c.options.map(o=>`<option value="${o}" ${row[c.field]===o?'selected':''}>${o}</option>`).join('');
        return `<td><select data-lopath="${arrayName}.${i}.${c.field}">${opts}</select></td>`;
      }
      const inputType = c.type==='date' ? 'date' : 'text';
      return `<td><input type="${inputType}" data-lopath="${arrayName}.${i}.${c.field}" value="${esc(row[c.field]||'')}" placeholder="${c.placeholder||''}"></td>`;
    }).join('');
    return `<tr>${cells}<td><button class="btn ghost sm" data-action="lo-remove-row" data-array="${arrayName}" data-index="${i}">✕</button></td></tr>`;
  }).join('');
  return `
  <div class="tbl-wrap">
    <table class="item-table">
      <thead><tr>${head}</tr></thead>
      <tbody>${body || `<tr><td colspan="${columns.length+1}" class="empty">No rows yet.</td></tr>`}</tbody>
    </table>
  </div>

  if(loSelectedTemplate==='private') return renderPrivateTemplateView(sc, w);
  if(loSelectedTemplate==='boi') return renderBoiTemplateView(sc, w);
  if(loSelectedTemplate==='cbi') return renderCbiTemplateView(sc, w);

  if(loSelectedTemplate==='kvb') return renderKvbTemplateView(sc, w);
  return renderTestTemplateView(sc, w);
}

function renderBobTemplateView(sc, w){
  if(!w.bankFormat) w.bankFormat = {enabled:true, bankId:'', data:freshBankFormatData()};
  if(!w.bankFormat.data) w.bankFormat.data = freshBankFormatData();
  const bd = w.bankFormat.data;
  const bank = state.banks.find(b=>b.id===w.bankFormat.bankId);
  const titleHolderNames = (w.titleHolders||[]).map(h=>h.name).filter(Boolean);
  const titleHolderOpts = (val) => `<option value="">— select —</option>` + titleHolderNames.map(n=>`<option value="${esc(n)}" ${val===n?'selected':''}>${esc(n)}</option>`).join('');
  const sel = (opts, val) => opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('');

  const propsText = (w.propertySchedules||[]).length ? w.propertySchedules.map(s=>`<p style="font-size:13px;line-height:1.8;margin:0 0 10px;">${esc(propertyScheduleText(s))}</p>`).join('') : `<p class="empty">Not filled in yet.</p>`;
  const docsTableRows = (rows) => rows.length ? rows.map(d=>`<tr><td class="mono" style="border:1px solid #ccc;">${esc(d.slNo||'')}</td><td style="border:1px solid #ccc;">${d.dateOfDocument?fmtDate(d.dateOfDocument):'—'}</td><td style="border:1px solid #ccc;">${esc(docRowDisplayName(d))}</td><td style="border:1px solid #ccc;">${esc(d.natureOfDocument||'—')}</td></tr>`).join('') : `<tr><td colspan="4" class="empty" style="border:1px solid #ccc;">Not filled in yet.</td></tr>`;
  const docsTable = (rows) => `<table class="pv-table" style="margin:0 0 14px;border-collapse:collapse;"><thead><tr><th style="border:1px solid #ccc;">S.No.</th><th style="border:1px solid #ccc;">Date</th><th style="border:1px solid #ccc;">Description of Documents</th><th style="border:1px solid #ccc;">Nature</th></tr></thead><tbody>${docsTableRows(rows)}</tbody></table>`;
  const introHtml = w.titleTracingIntro ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${esc(w.titleTracingIntro).replace(/\n/g,'<br>')}</p>` : '';
  const tracingHtml = (w.documentsList||[]).length ? w.documentsList.map(d=>d.tracingText ? `<p style="font-size:13px;line-height:1.7;margin:0 0 12px;">${renderTracingDisplayText(d.tracingText, d.slNo||'')}</p>` : '').join('') : '';

  // A row with the question on the left and live editable controls + a live composed preview on the right
  const qrow = (n, question, controlsHtml, composed) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr>
      <td style="font-weight:700;width:34px;vertical-align:top;border:1px solid #ccc;">${n}.</td>
      <td style="width:38%;vertical-align:top;border:1px solid #ccc;">${question}</td>
      <td style="vertical-align:top;border:1px solid #ccc;">
        ${controlsHtml}
        ${composed ? `<div class="hint" style="margin-top:8px;font-style:italic;">${composed}</div>` : ''}
      </td>
    </tr>
  </tbody></table>`;
  // A heading row for items whose content is a table/prose block below (1, 11, 14, 15, 18, 19)
  const heading = (n, question) => `
  <table class="pv-table" style="margin-bottom:0;border-collapse:collapse;"><tbody>
    <tr><td style="font-weight:700;width:34px;vertical-align:top;border:1px solid #ccc;">${n}.</td><td style="border:1px solid #ccc;">${question}</td></tr>
  </tbody></table>`;
  const fld = (html) => `<div class="field" style="margin-bottom:8px;">${html}</div>`;

  return `
  <div class="btnrow" style="margin-bottom:14px;"><button class="btn outline sm" data-action="lo-back-to-templates">&larr; Back to Templates</button></div>

  <div class="field" style="max-width:420px;margin-bottom:16px;">
    <label>Bank &amp; Branch</label>
    <select id="loBankSelect">
      <option value="">— select bank / branch —</option>
      ${state.banks.map(b=>`<option value="${b.id}" ${w.bankFormat.bankId===b.id?'selected':''}>${esc(b.bankName)} — ${esc(b.branchName)}</option>`).join('')}
    </select>
    ${state.banks.length===0?`<div class="hint">No banks added yet — add one in Master Data → Bank Master Data.</div>`:''}
  </div>

  <div class="pv-sheet" style="max-width:100%;">
    <div class="pv-content" style="padding:6px 4px 20px;">
      ${bankFormatHeaderHTML(sc, w, bank)}

      ${heading(1, 'Description and area of the property proposed to be mortgaged. (Specific number(s) and address of property along with boundaries and measurements)')}
      <div style="padding:10px 0 14px;">${propsText}</div>

      ${qrow(2, 'Nature of Property (Whether Agricultural, Non-Agricultural, Commercial, Residential, Industrial. If Non-Agricultural, the reference and date of conversion order from Competent Authority should also be mentioned).',
        fld(`<select class="bob-cascade-select" data-lopath="bankFormat.data.propertyNature"><option value="">— select —</option>${sel(BOB_PROPERTY_NATURE, bd.propertyNature)}</select>`) +
        (bd.propertyNature && bd.propertyNature!=='Agricultural' ? fld(`<input data-lopath="bankFormat.data.conversionOrderText" value="${esc(bd.conversionOrderText)}" placeholder="Conversion Order reference and date">`) : ''),
        esc(bobItem2(bd)))}

      ${qrow(3, "Name of the mortgagor/owner and status in the account i.e., borrower or guarantor and whether individual, sole proprietor, Partner, Director, Karta or Trustee. In case the mortgagor is partner/director/trustee who is mortgaging the property on behalf of Partnership/Company/Trust whether he/she has the authority. Copy of the Resolution/memorandum & articles of association/Trust deed etc. whether examined and verified.",
        fld(`<select class="bob-cascade-select" data-lopath="bankFormat.data.mortgagorMode"><option value="">— select —</option><option value="individual" ${bd.mortgagorMode==='individual'?'selected':''}>Individual Capacity</option><option value="company" ${bd.mortgagorMode==='company'?'selected':''}>Company / Trust Property</option></select>`) +
        fld(`<select class="bob-cascade-select" data-lopath="bankFormat.data.mortgagorTitleHolder">${titleHolderOpts(bd.mortgagorTitleHolder)}</select>`) +
        (bd.mortgagorMode ? fld(`<select class="bob-cascade-select" data-lopath="bankFormat.data.mortgagorBorrowerType"><option value="">— Borrower/Guarantor —</option>${sel(BOB_BORROWER_TYPES, bd.mortgagorBorrowerType)}</select>`) : '') +

const PRIVATE_DISCLAIMER = `This legal opinion has been rendered solely on the basis of the documents listed and made available to us for perusal, which are limited to photocopies and not original documents. The verification of the genuineness, authenticity, and enforceability of these documents does not fall within the scope of this opinion and has not been independently undertaken. Further, this opinion does not cover any risks or legal implications arising out of the non-availability of certain additional documents, as listed under the heading "Additional Documents Required." The absence of such documents may have a material bearing on the title, rights, or encumbrances associated with the property and must be independently verified. This opinion is given solely for the benefit of the person or entity to whom it is addressed and shall not be relied upon by any other party without the prior written consent of the undersigned.`;

function privateDocsTable(rows){
  const body = rows.length ? rows.map(d=>`<tr>
    <td class="mono" style="border:1px solid #ccc;">${esc(d.slNo||'')}</td>

    <td style="border:1px solid #ccc;">${esc(d.documentNumber||'—')}</td>

  </tr>`).join('') : `<tr><td colspan="5" class="empty" style="border:1px solid #ccc;">Not filled in yet.</td></tr>`;
  return `<table class="pv-table" style="margin:0 0 14px;border-collapse:collapse;"><thead><tr>
    <th style="border:1px solid #ccc;">Sl.No.</th><th style="border:1px solid #ccc;">Date of Document</th><th style="border:1px solid #ccc;">Particulars of Documents</th><th style="border:1px solid #ccc;">Document Number</th><th style="border:1px solid #ccc;">Whether Original or Xerox</th>

}
