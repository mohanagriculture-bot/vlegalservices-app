<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin | V Legal Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#0F1B2D;--navy:#16233A;--brass:#A9762F;--brass-lt:#D2A460;--paper:#F7F5EF;--line:#E3DED1;--muted:#8D96A6;
  --serif:'Source Serif 4',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--paper);display:flex;flex-direction:column}
.top{background:var(--ink);color:#C4CBD7;display:flex;align-items:center;gap:18px;padding:0 18px;height:58px;flex:none;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.seal{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--brass-lt);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--brass-lt);font-size:15px}
.brand b{font-family:var(--serif);font-weight:600;font-size:16px}
.brand small{display:block;font-size:10px;letter-spacing:.14em;color:var(--brass-lt)}
.tabs{display:flex;gap:4px;height:100%;overflow-x:auto;flex:1}
.tabs button{font:inherit;font-size:14px;font-weight:500;background:none;border:none;color:#AEB6C4;padding:0 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--brass-lt)}
.who{font-size:13px;white-space:nowrap}
.out{font:inherit;font-size:13px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:7px 12px;cursor:pointer;flex:none}
.out:hover{background:rgba(255,255,255,.14)}
.stage{flex:1;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--paper)}
.stage iframe.on{display:block}
.pane{position:absolute;inset:0;overflow:auto;display:none;padding:34px 20px}
.pane.on{display:block}
.pane .in{max-width:880px;margin:0 auto}
.pane h2{font-family:var(--serif);color:var(--navy);font-size:24px;margin:0 0 6px;font-weight:600}
.pane p.lede{color:#5E6573;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.cl h3{font-family:var(--serif);color:var(--navy);margin:0 0 4px;font-size:19px;font-weight:600}
.cl small{color:#5E6573}
.cl a{display:block;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--navy);text-decoration:none;font-weight:500;font-size:14px}
.cl a:hover{border-color:var(--brass);color:var(--brass)}
.gate{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;color:#5E6573;z-index:5}
@media (max-width:760px){.who,.brand span{display:none}.top{gap:10px;padding:0 10px}}
</style>
</head>
<body>
<div class="gate" id="gate">Checking your sign-in…</div>

<header class="top">
  <a class="brand" href="/" target="_blank" rel="noopener"><span class="seal">V</span><span><b>V Legal Services</b><small>ADMIN</small></span></a>
  <nav class="tabs" role="tablist">
    <button role="tab" data-t="practice" aria-selected="true">Practice system</button>
    <button role="tab" data-t="tasks" aria-selected="false">Task board</button>
    <button role="tab" data-t="clients" aria-selected="false">Clients</button>
  </nav>
  <span class="who" id="who"></span>
  <button class="out" id="out">Sign out</button>
</header>

<div class="stage">
  <iframe id="f-practice" title="Practice system" data-src="/portal/"></iframe>
  <iframe id="f-tasks" title="Task board" data-src="/admin/tasks/"></iframe>
  <iframe id="f-clients" title="Clients" data-src="/admin/clients/"></iframe>
</div>

<script>
var sb = window.supabase.createClient('https://tjvvqoomaptxscgiziks.supabase.co', 'sb_publishable_ROQ1neYXpAnHftMmuwZrrw_YFrvNztm');

function show(t){
  document.querySelectorAll('.tabs button').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.t===t ? 'true':'false'); });
  document.querySelectorAll('.stage > *').forEach(function(el){
    var on = el.id === 'f-'+t;
    el.classList.toggle('on', on);
    if(on && el.tagName==='IFRAME' && !el.src) el.src = el.dataset.src;
  });
  try { sessionStorage.setItem('adm_tab', t); } catch(e){}
}

(async function(){
  var s = (await sb.auth.getSession()).data.session;
  if(!s){ location.replace('/login/'); return; }
  var owner = s.user.email === 'vlegal2025@gmail.com';
  try {
    var fs = await sb.from('firm_settings').select('owner_id').limit(1);
    if(fs.data && fs.data[0] && fs.data[0].owner_id === s.user.id) owner = true;
  } catch(e){}
  if(!owner){ location.replace('/portal/'); return; }
  document.getElementById('who').textContent = 'MKR · ' + s.user.email;
  var t = 'practice'; try { t = sessionStorage.getItem('adm_tab') || 'practice'; } catch(e){}
  show(t);
  document.getElementById('gate').remove();
})();

document.querySelectorAll('.tabs button').forEach(function(b){ b.addEventListener('click', function(){ show(b.dataset.t); }); });
document.getElementById('out').addEventListener('click', async function(){
  await sb.auth.signOut();
  try { sessionStorage.clear(); } catch(e){}
  location.replace('/login/');
});
</script>
</body>
</html>
